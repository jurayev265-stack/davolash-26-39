<style>html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: mobile app shell — gradient-free header with today's date, scrolling view, floating pill tab bar.
   Atlas convention carried over: arterial red = accent, venous blue = secondary; each subject gets its own hue. */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --surface-2:#F6F8FA; --ink:#121A23; --muted:#5F6C79; --faint:#8C98A4; --line:#E1E6EC;
  --accent:#C42847; --accent-soft:#FBE7EB; --vein:#2D63A6; --vein-soft:#E4EDF8; --ok:#1E8A55; --ok-soft:#DFF3E8;
  --shadow:0 1px 2px rgba(18,26,35,.06),0 8px 24px -12px rgba(18,26,35,.18);
  --c-anat:#C42847; --c-kim:#C27A0E; --c-bio:#1E8A55; --c-tarix:#5B4BC4; --c-til:#0E8C8C; --c-kasb:#2D63A6;
  --f-latin:"Spectral",Georgia,"Times New Roman",serif;
  --f-ui:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1015; --surface:#141B22; --surface-2:#1A222B; --ink:#E8EEF4; --muted:#9AA7B4; --faint:#6E7B88; --line:#232D37;
  --accent:#F0607B; --accent-soft:#3B1C25; --vein:#7FB0EA; --vein-soft:#18283A; --ok:#4FCB8C; --ok-soft:#14301F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
  --c-anat:#F0607B; --c-kim:#E9A23B; --c-bio:#4FCB8C; --c-tarix:#9C90F0; --c-til:#3FC7C7; --c-kasb:#7FB0EA; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0B1015; --surface:#141B22; --surface-2:#1A222B; --ink:#E8EEF4; --muted:#9AA7B4; --faint:#6E7B88; --line:#232D37;
  --accent:#F0607B; --accent-soft:#3B1C25; --vein:#7FB0EA; --vein-soft:#18283A; --ok:#4FCB8C; --ok-soft:#14301F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
  --c-anat:#F0607B; --c-kim:#E9A23B; --c-bio:#4FCB8C; --c-tarix:#9C90F0; --c-til:#3FC7C7; --c-kasb:#7FB0EA; color-scheme:dark }

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--vein);outline-offset:2px;border-radius:8px}
.wrap{width:100%;max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#view>*{min-width:0;max-width:100%}

/* header */
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 6px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:38px;height:38px;border-radius:12px;background:var(--accent);display:grid;place-items:center;flex:none;box-shadow:0 6px 16px -6px var(--accent)}
.logo svg{width:22px;height:22px}
.logo .lg{display:flex;flex-direction:column;align-items:center;color:#fff;font-weight:900;font-size:12.5px;line-height:1;letter-spacing:-.02em}
.logo .lg i{display:block;width:60%;height:1.5px;background:#fff;opacity:.8;margin:2px 0;border-radius:2px}
.gate-card .logo .lg{font-size:18px}
.brand-t{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand-t b{font-weight:800;font-size:17px;letter-spacing:-.01em}
.brand-t span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.datebox{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right;flex:none}
.datebox b{display:block;color:var(--ink);font-family:var(--f-ui);font-size:14px;font-weight:700}

main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
main .wrap{padding-block:12px 24px;display:flex;flex-direction:column;gap:16px}
#view{display:flex;flex-direction:column;gap:16px}
#sub:empty{display:none}
#view{animation:fade .22s ease}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
h1{font-weight:800;font-size:26px;line-height:1.15;margin:0;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0;font-weight:700}
p{margin:0}
.lede{color:var(--muted);max-width:60ch;font-size:14.5px}
.titlebar{display:flex;flex-direction:column;gap:4px}

.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}
.note{border-radius:16px;padding:12px 14px;font-size:13.5px;color:var(--muted);background:var(--surface-2);border:1px dashed var(--line)}
.note b{color:var(--ink)}

/* segmented day picker / chips */
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--surface);padding:4px;border-radius:16px;box-shadow:var(--shadow)}
.seg button{border:0;background:none;border-radius:12px;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button small{font-family:var(--f-mono);font-size:10.5px;font-weight:500;letter-spacing:.04em}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:2px}
.seg button:not(.today) .dot{visibility:hidden}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:700;white-space:nowrap;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip .n{font-family:var(--f-mono);font-size:11px;opacity:.75;margin-left:6px;font-weight:500}

/* schedule */
.now{padding:18px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.now .tag{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:8px}
.now .tag i{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 var(--accent);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
.now .hsubj{font-size:21px;font-weight:800;line-height:1.2;letter-spacing:-.01em}
.now .meta{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:700;background:var(--surface-2);color:var(--muted)}
.pill.room{background:var(--ink);color:var(--bg);font-family:var(--f-mono);font-weight:600}
.timeline{display:flex;flex-direction:column;gap:10px}
.lesson{display:grid;grid-template-columns:62px 1fr;gap:12px;align-items:stretch}
.lesson .t{display:flex;flex-direction:column;align-items:flex-end;padding-top:14px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.lesson .t b{font-size:14.5px;font-weight:600}
.lesson .t small{font-size:11.5px;color:var(--faint)}
.lesson .body{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:13px 14px 13px 16px;display:flex;flex-direction:column;gap:7px;position:relative;overflow:hidden;min-width:0}
.lesson .body::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--sc,var(--vein))}
.lesson .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lesson .para{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--sc,var(--muted))}
.lesson .name{font-weight:800;font-size:16px;line-height:1.3}
.lesson .who{font-size:13px;color:var(--muted)}
.lesson.free .body{background:transparent;box-shadow:none;border:1.5px dashed var(--line);padding-block:10px}
.lesson.free .body::before{display:none}
.lesson.free .name{font-weight:600;font-size:13.5px;color:var(--faint)}
.lesson.live .body{outline:2px solid var(--accent);outline-offset:-2px}
.lesson.past{opacity:.55}
.type{font-size:11px;font-weight:800;letter-spacing:.04em;padding:3px 8px;border-radius:999px;background:color-mix(in srgb,var(--sc) 14%,transparent);color:var(--sc)}
.daysum{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.daysum b{color:var(--ink)}

/* flashcard */
.specimen{background:var(--surface);border:0;border-radius:24px;box-shadow:var(--shadow);min-height:260px;display:flex;flex-direction:column;justify-content:space-between;padding:18px 20px 20px;text-align:left;width:100%;position:relative;overflow:hidden}
.specimen::after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:var(--accent-soft);opacity:.7}
.specimen>*{position:relative;z-index:1}
.specimen .top{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.specimen .top .cat{color:var(--accent);font-weight:600}
.specimen .latin{font-family:var(--f-latin);font-style:italic;font-weight:500;font-size:clamp(30px,8.5vw,44px);line-height:1.1;text-wrap:balance;word-break:break-word}
.specimen .uz{font-size:19px;font-weight:800;min-height:1.6em}
.specimen .hint{font-size:13px;color:var(--muted)}
.specimen.flipped .hint{visibility:hidden}
.specimen .uz.hidden{background:repeating-linear-gradient(90deg,var(--line) 0 12px,transparent 12px 16px);border-radius:6px;max-width:220px}
.row{display:flex;gap:10px}
.row>*{flex:1}
.btn{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:14px;padding:13px 14px;font-weight:800;font-size:15px}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 8px 18px -10px var(--accent)}
.btn.vein{background:var(--vein);color:var(--bg)}
.btn.ghost{background:transparent;box-shadow:none;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:default}
.btn:active{transform:scale(.98)}
.progress{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.bar{flex:1;height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .35s}

/* test */
.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.subj{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.subj .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--sc) 15%,transparent);color:var(--sc);font-weight:800;font-size:15px}
.subj b{font-size:15px;font-weight:800}
.subj small{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.subj.lat b{font-family:var(--f-latin);font-style:italic;font-size:18px;font-weight:500}
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);font-weight:700}
.qhead .sc{font-family:var(--f-mono)}
.qtext{font-size:19px;font-weight:800;line-height:1.35;text-wrap:pretty}
.qtext em{font-family:var(--f-latin);font-size:25px;font-weight:500}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:2px solid transparent;box-shadow:var(--shadow);border-radius:16px;padding:12px 14px;font-size:15.5px;font-weight:600;width:100%}
.opt .k{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:8px;width:28px;height:28px;display:grid;place-items:center;flex:none}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--accent);background:var(--accent-soft)}
.opt.wrong .k{background:var(--accent);color:#fff}
.opt[disabled]{cursor:default}
.explain{font-size:14px;color:var(--muted);background:var(--vein-soft);border-radius:14px;padding:10px 14px}
.result{padding:24px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.result .big{font-weight:800;font-size:60px;line-height:1;letter-spacing:-.03em}
.result .big small{font-size:24px;color:var(--muted)}

.trow{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;text-align:left;padding:13px 14px;border-top:1px solid var(--line)}
.tlist .trow:first-child{border-top:0}
.trow .tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.trow .tt b{font-size:15px;font-weight:800}
.trow .tt small{font-size:12.5px;color:var(--muted);line-height:1.35}
.trow .tgo{font-family:var(--f-mono);font-size:12.5px;font-weight:600;color:var(--sc);background:color-mix(in srgb,var(--sc) 12%,transparent);border-radius:9px;padding:6px 8px;flex:none}
.tbar{display:block;height:5px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px;width:100%}
.tbar i{display:block;height:100%;background:var(--sc,var(--ok));border-radius:99px}
.specimen .latin.plain,.qtext em.plain{font-family:var(--f-ui,inherit);font-style:normal;font-weight:800;font-size:clamp(22px,6vw,30px)}
.qtext em.plain{font-size:20px}
.pinlock{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;display:flex;justify-content:center;padding:max(28px,env(safe-area-inset-top,0px)) 16px max(20px,env(safe-area-inset-bottom,0px))}
.pinlock[hidden]{display:none}
.pin-card{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;margin-top:4vh}
.pin-card .logo{width:60px;height:60px;border-radius:19px;margin-bottom:6px}
.pin-card .logo .lg{font-size:18px}
.pin-card h2{font-size:22px;font-weight:800;text-transform:none;letter-spacing:-.01em;color:var(--ink)}
.pin-card .lede{font-size:14px;max-width:300px}
.pin-card .btn{width:100%}
.pin-dots{display:flex;gap:18px;margin:14px 0 2px}
.pin-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted);transition:background .15s}
.pin-dots i.on{background:var(--accent);border-color:var(--accent)}
.pin-dots.shake{animation:pinshake .35s}
@keyframes pinshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pin-msg{min-height:20px;font-size:13.5px;font-weight:700;color:var(--muted)}
.pin-msg.err{color:var(--accent)}
.pin-pad{display:grid;grid-template-columns:repeat(3,76px);gap:16px 26px;margin-top:6px}
.pin-pad .pk{display:grid;place-items:center;padding:0;text-align:center;width:76px;height:76px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);font-size:30px;font-weight:700;color:var(--ink)}
.pin-pad .pk:active{background:var(--accent-soft);transform:scale(.96)}
.pin-pad .pk-t{display:grid;place-items:center;padding:0;text-align:center;width:76px;height:76px;border:0;background:transparent;font-size:15px;font-weight:800;color:var(--muted)}
.pin-pad .pk-t[data-k="del"]{font-size:26px}
.updbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--accent);color:#fff;border-radius:14px;padding:10px 12px;margin:10px 16px 0;font-size:13.5px;position:sticky;top:0;z-index:5}
.updbar .mini{background:#fff;color:var(--accent);flex:none}
.wrongs .t div{white-space:normal;overflow:visible}
.libg{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.libg h3{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:4px 2px 0}
.file .t .wrap2{white-space:normal;overflow:visible;line-height:1.3}
.exitask{position:fixed;inset:0;z-index:80;background:rgba(10,15,20,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.exit-card{width:100%;max-width:420px;background:var(--surface);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:16px;margin-bottom:env(safe-area-inset-bottom,0px)}
.exit-card h2{font-size:19px;font-weight:800;text-transform:none;letter-spacing:0;color:var(--ink)}
.bio-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:300px;color:var(--accent)}
.bio-ic{color:var(--accent);margin:4px 0}
.bio-ic svg{width:44px;height:44px}
/* form */
form{display:flex;flex-direction:column;gap:14px;padding:18px}
label{display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:700}
input[type=text],select,textarea{border:1.5px solid var(--line);background:var(--surface-2);border-radius:12px;padding:11px 12px;font-weight:500;font-size:15px;width:100%}
input[type=text]:focus,select:focus,textarea:focus{border-color:var(--vein);outline:none}
textarea{min-height:80px;resize:vertical}
.optin{display:flex;gap:10px;align-items:center}
.optin input[type=radio]{width:22px;height:22px;accent-color:var(--ok);flex:none}
.optin input[type=text]{flex:1;min-width:0}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
legend{font-size:13.5px;font-weight:700;margin-bottom:6px}
.formmsg{font-size:14px;min-height:1.4em;font-weight:600}
.formmsg.ok{color:var(--ok)} .formmsg.err{color:var(--accent)}

.list{display:flex;flex-direction:column;overflow:hidden}
.li{display:flex;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .t{flex:1;min-width:0}
.li .t div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.li .t small{color:var(--muted);font-size:12.5px}
.li .del{border:0;background:var(--accent-soft);color:var(--accent);font-size:12.5px;font-weight:800;padding:6px 10px;border-radius:10px}

/* leaderboard */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:10px;align-items:end}
.pod{background:var(--surface);box-shadow:var(--shadow);border-radius:18px;padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.pod .av{width:44px;height:44px;font-size:17px}
.pod.p1{padding-top:20px;background:linear-gradient(var(--accent-soft),var(--surface))}
.pod.p1 .av{width:54px;height:54px;font-size:20px;box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--accent)}
.pod .nm{font-weight:800;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .pl{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.pod .pt{font-family:var(--f-mono);font-weight:600;font-size:15px}
.av{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff}
.lb .rank{font-family:var(--f-mono);font-size:13px;width:24px;color:var(--muted);flex:none}
.lb .pts{font-family:var(--f-mono);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.lb .pts small{display:block;font-size:10.5px;color:var(--muted);font-weight:500}
.lb .li.me{background:var(--vein-soft)}
.empty{padding:24px 16px;text-align:center;color:var(--muted);font-size:14px}
.empty a{color:var(--accent);font-weight:700}

/* tab bar */
nav{padding-bottom:max(10px,env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 35%)}
nav .wrap{padding-block:6px 0}
nav .bar5{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:6px}
nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;border-radius:16px;text-decoration:none;color:var(--faint);font-size:10.5px;font-weight:800;letter-spacing:.01em}
nav a svg{width:22px;height:22px}
nav a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}


/* study sub-tabs */
.subtabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface);padding:4px;border-radius:14px;box-shadow:var(--shadow)}
.subtabs a{text-align:center;text-decoration:none;color:var(--muted);font-weight:800;font-size:13px;padding:8px 0;border-radius:10px}
.subtabs a[aria-current="page"]{background:var(--ink);color:var(--bg)}

/* reminder banner */
.alert{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:18px;background:var(--accent);color:#fff;text-decoration:none;box-shadow:0 10px 24px -12px var(--accent)}
.alert.today{background:#C27A0E;box-shadow:0 10px 24px -12px #C27A0E}
.alert .h{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.9;display:flex;align-items:center;gap:8px}
.alert .h svg{width:16px;height:16px}
.alert .s{font-weight:800;font-size:17px;line-height:1.25}
.alert .tx{font-size:14px;line-height:1.45;background:rgba(255,255,255,.16);border-radius:12px;padding:8px 10px;white-space:pre-wrap;word-break:break-word}
.alert .m{font-size:12.5px;opacity:.9}

/* subjects (fanlar) */
.fan-grid{display:flex;flex-direction:column;gap:10px}
.fan{display:flex;gap:14px;align-items:center;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:14px;text-decoration:none;color:inherit;min-width:0}
.fan .ic{width:44px;height:44px;border-radius:14px;flex:none;display:grid;place-items:center;font-weight:800;font-size:17px;background:color-mix(in srgb,var(--sc) 15%,transparent);color:var(--sc)}
.fan .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.fan .t b{font-size:15.5px;font-weight:800;line-height:1.25}
.fan .t small{font-size:12.5px;color:var(--muted)}
.fan .badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:800;border-radius:999px;padding:3px 8px;background:var(--surface-2);color:var(--muted)}
.badge.hw{background:var(--accent-soft);color:var(--accent)}
.fan .chev{color:var(--faint);flex:none}
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--muted);font-weight:800;font-size:13.5px}
.fanhead{padding:18px;display:flex;flex-direction:column;gap:10px;border-top:5px solid var(--sc)}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:center}
.hw{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.hw .due{font-size:12px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.hw .topic{font-weight:800;font-size:15.5px}
.hw .txt{white-space:pre-wrap;word-break:break-word;font-size:14.5px}
.hw .by{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--faint)}
.mini{border:0;background:var(--surface-2);color:var(--muted);font-weight:800;font-size:12.5px;padding:7px 11px;border-radius:10px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.mini.red{background:var(--accent-soft);color:var(--accent)}
.mini.blue{background:var(--vein-soft);color:var(--vein)}
.file{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.file:first-child{border-top:0}
.file .fi{width:40px;height:44px;border-radius:9px;flex:none;display:grid;place-items:center;font-family:var(--f-mono);font-size:10.5px;font-weight:600;color:#fff;background:var(--sc,var(--vein))}
.file .t{flex:1;min-width:0}
.file .t div{font-weight:800;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .t small{font-size:12px;color:var(--muted)}
.fileinp{padding:10px!important;background:var(--surface-2)}
.orline{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px;font-weight:700;margin:2px 0 10px}
.orline:before,.orline:after{content:"";flex:1;height:1px;background:var(--line)}
.file .acts{display:flex;gap:6px;width:100%;padding-left:52px}
form.compact{padding:14px;gap:10px}
input[type=file]{font-size:13.5px;width:100%}

/* group list */
.gstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gstat{background:var(--surface);box-shadow:var(--shadow);border-radius:16px;padding:12px;display:flex;flex-direction:column}
.gstat b{font-size:24px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.gstat small{font-size:12px;color:var(--muted);font-weight:700}
.search{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:14px;padding:12px 14px;width:100%;font-size:15px}
.st{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;color:inherit}
.st:first-child{border-top:0}
.st .ph{width:52px;height:68px;border-radius:12px;flex:none;object-fit:cover;background:var(--surface-2)}
.st .ph.none{display:grid;place-items:center;font-weight:800;color:#fff}
.st .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.st .t b{font-weight:800;font-size:15px;line-height:1.25}
.st .t small{font-size:12.5px;color:var(--muted)}
.st .n{font-family:var(--f-mono);font-size:12px;color:var(--faint);width:20px;flex:none;text-align:right}
.st-more{padding:0 14px 14px 98px;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.st-more .kv{display:flex;flex-direction:column}
.st-more .kv span{font-size:11.5px;font-weight:800;color:var(--faint);text-transform:uppercase;letter-spacing:.05em}
.st-more .kv b{font-weight:600;word-break:break-word}
.adminc{padding:16px;display:flex;gap:14px;align-items:center;border:2px solid var(--accent)}
.adminc .ph{width:64px;height:84px;border-radius:14px;object-fit:cover;flex:none;background:var(--surface-2)}
.role{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
@media (max-width:380px){.st-more{padding-left:14px}}

.wk{display:flex;flex-direction:column;gap:6px}
.wk-r{display:grid;grid-template-columns:86px 44px auto auto 1fr;gap:8px;align-items:center;font-size:13px}
.wk-d{font-weight:800}
.wk-t{font-family:var(--f-mono);font-size:12.5px}
.wk-w{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
@media (max-width:420px){.wk-r{grid-template-columns:82px 42px auto auto}.wk-w{grid-column:1/-1;padding-left:2px;margin-top:-4px}}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.pk{border:1.5px solid var(--line);background:var(--surface-2);border-radius:12px;padding:9px 10px;text-align:left;display:flex;flex-direction:column;gap:1px}
.pk b{font-size:13.5px}
.pk span{font-size:12px;color:var(--muted)}
.pk[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pk[aria-pressed="true"] span{color:var(--accent)}
details.install{font-size:13.5px;color:var(--muted)}
details.install summary{cursor:pointer;font-weight:700;color:var(--vein)}
details.install ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.gate{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.gate-card{max-width:420px;margin:6vh auto 0;display:flex;flex-direction:column;gap:14px}
.gate-card .logo{width:56px;height:56px;border-radius:18px}
.gate-card form{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:18px}
.gate-links{display:flex;flex-wrap:wrap;gap:8px}

/* ---------------- 0. Jadval ---------------- */
function lessonState(l,n){
  if(l.d!==n.wd) return "";
  const [s,e]=PARAS[l.p].map(toMin);
  return n.min>=s&&n.min<e?"live":n.min>=e?"past":"";
}
function lessonCard(l,state){
  const [s,e]=PARAS[l.p];
  return `<div class="lesson ${state}" style="--sc:${SC[l.key]}">
    <div class="t"><b>${s}</b><small>${e}</small></div>
    <div class="body">
      <div class="top"><span class="para">${l.p}-para${state==="live"?" · hozir":""}</span><span class="type">${l.type}</span></div>
      <div class="name">${esc(l.name)}</div>
      <div class="top"><span class="who">${esc(l.who)}</span><span class="pill room">${l.room}</span></div>
    </div></div>`;
}
function viewSchedule(){
  const n=nowTash();
  if(S.day==null) S.day = n.wd<=4 ? n.wd : 0;
  const day=S.day; const list=LESSONS.filter(l=>l.d===day).sort((a,b)=>a.p-b.p);
  const isToday=day===n.wd;
  // hero: current / next lesson today, else first lesson of the next school day
  let hero="";
  if(n.wd<=4){
    const today=LESSONS.filter(l=>l.d===n.wd).sort((a,b)=>a.p-b.p);
    const live=today.find(l=>lessonState(l,n)==="live");
    const next=today.find(l=>toMin(PARAS[l.p][0])>n.min);
    const pick=live||next;
    if(pick){
      const mins=toMin(PARAS[pick.p][0])-n.min;
      const label=live?"Hozir darsda":mins<=60?`${mins} daqiqadan keyin`:"Bugungi keyingi dars";
      hero=heroCard(pick,label,live);
    }
  }
  if(!hero){
    const nd = n.wd>=4 ? 0 : n.wd+1; const first=LESSONS.filter(l=>l.d===nd).sort((a,b)=>a.p-b.p)[0];
    if(first) hero=heroCard(first, n.wd>=4?`Dushanba · birinchi dars`:`Ertaga · birinchi dars`, false);
  }
  const rows=[]; const maxP=list.length?Math.max(...list.map(l=>l.p)):0; const minP=list.length?Math.min(...list.map(l=>l.p)):0;
  for(let p=minP;p<=maxP;p++){
    const l=list.find(x=>x.p===p);
    if(l) rows.push(lessonCard(l,isToday?lessonState(l,n):""));
    else rows.push(`<div class="lesson free"><div class="t"><b>${PARAS[p][0]}</b><small>${PARAS[p][1]}</small></div><div class="body"><div class="name">${p}-para · bo'sh vaqt</div></div></div>`);
  }
  const first=list[0], last=list[list.length-1];
  $("#view").innerHTML=`
    ${hwBanner()}
    ${hero}
    <div class="seg" role="group" aria-label="Hafta kuni">${DAYS.map(([full,short],i)=>`<button data-d="${i}" aria-pressed="${i===day}" class="${i===n.wd?"today":""}" aria-label="${full}">${short}<small>${LESSONS.filter(l=>l.d===i).length} para</small><span class="dot"></span></button>`).join("")}</div>
    <div class="titlebar"><h1>${DAYS[day][0]}${isToday?" · bugun":""}</h1>
      ${first?`<div class="daysum"><span><b>${list.length}</b> ta para</span><span>·</span><span><b>${PARAS[first.p][0]}</b> dan <b>${PARAS[last.p][1]}</b> gacha</span></div>`:""}</div>
    <div class="timeline">${rows.join("")||`<div class="card empty">Bu kuni dars yo'q.</div>`}</div>
    <p class="lede" style="font-size:13px">Har bir para 80 daqiqa. Sariq qatordagi ma'ruzalar butun oqim uchun umumiy.</p>`;
  document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{S.day=+b.dataset.d;viewSchedule();});
}
function heroCard(l,label,live){
  const [s,e]=PARAS[l.p];
  return `<div class="card now" style="--sc:${SC[l.key]}">
    <div class="tag">${live?"<i></i>":""}${label}</div>
    <div class="hsubj">${esc(l.name)}</div>
    <div class="meta"><span class="pill room">${l.room}</span><span class="pill">${s} – ${e}</span><span class="pill">${l.p}-para</span><span class="pill" style="color:${SC[l.key]}">${l.type}</span></div>
    <div class="lede" style="font-size:13.5px">${esc(l.who)}</div>
  </div>`;
}

/* ---------------- 1. Atamalar (kartochkalar) ---------------- */
function termLabelUz(s){ return s.termLabel==="Lotincha"?"o'zbekcha nomi":s.termLabel==="Inglizcha"?"o'zbekcha tarjimasi":"ma'nosi"; }
function termPool(sk,topic){ const s=QB.subj[sk]; const tps=topic==="all"?s.topics:s.topics.filter(t=>String(t.n)===String(topic));
  const out=[]; tps.forEach(t=>t.terms.forEach(r=>out.push({la:r[0],uz:r[1],tn:t.n}))); return out; }
function resetDeck(){ const d=termPool(S.cards.subj,S.cards.topic); const unknown=d.filter(t=>!S.known.has(S.cards.subj+"|"+t.la)); const pool=unknown.length?unknown:d;
  S.cards.order=shuffle(pool).map(t=>t.la); S.cards.i=0; S.cards.flipped=false; }
function viewTerms(){
  const sk=S.cards.subj, s=QB.subj[sk];
  if(!S.cards.order.length) resetDeck();
  const d=termPool(sk,S.cards.topic); const known=d.filter(t=>S.known.has(sk+"|"+t.la)).length;
  const t=d.find(x=>x.la===S.cards.order[S.cards.i])||d[0];
  const subjBtns=QB.order.map(k=>`<button class="chip" data-cs="${k}" aria-pressed="${k===sk}">${esc(QB.subj[k].name.split(".")[0].replace(/ \(.*/,""))}</button>`).join("");
  const topicBtns=[`<button class="chip" data-ct="all" aria-pressed="${S.cards.topic==="all"}">Hammasi<span class="n">${termPool(sk,"all").length}</span></button>`,
    ...s.topics.filter(tp=>tp.terms.length).map(tp=>`<button class="chip" data-ct="${tp.n}" aria-pressed="${String(S.cards.topic)===String(tp.n)}">${tp.n}-mavzu<span class="n">${tp.terms.length}</span></button>`)].join("");
  const tp=s.topics.find(x=>x.n===t.tn);
  $("#view").innerHTML=`
    <div class="titlebar"><h1>Atamalar</h1>
      <p class="lede">Kartani bosing — tarjimasi ochiladi. "Bilaman" desangiz, karta kamroq chiqadi.</p></div>
    <div class="chips" role="group" aria-label="Fan">${subjBtns}</div>
    <div class="chips" role="group" aria-label="Mavzu">${topicBtns}</div>
    <button class="specimen ${S.cards.flipped?"flipped":""}" id="card" aria-label="Kartani ochish">
      <div class="top"><span>${esc(s.termLabel)}</span><span class="cat">${tp?tp.n+"-mavzu":""}</span></div>
      <div class="latin ${s.termLabel==="Lotincha"?"":"plain"}">${esc(t.la)}</div>
      <div><div class="uz ${S.cards.flipped?"":"hidden"}">${S.cards.flipped?esc(t.uz):"&nbsp;"}</div>
        <div class="hint">${tp?esc(tp.t):""}</div></div>
    </button>
    <div class="row"><button class="btn" id="again">Yana takrorlayman</button><button class="btn primary" id="know">Bilaman</button></div>
    <div class="progress"><span>${known}/${d.length} yodlandi</span><div class="bar"><i style="width:${d.length?known/d.length*100:0}%"></i></div>
      <button class="btn ghost" id="resetKnown" style="padding:4px 8px;font-size:12px">Nolga</button></div>
    <a class="btn vein" href="#test" id="toTest" style="text-align:center;text-decoration:none">Shu atamalardan test ishlash</a>`;
  document.querySelectorAll("[data-cs]").forEach(b=>b.onclick=()=>{S.cards.subj=b.dataset.cs;S.cards.topic="all";store.set("cards-subj",S.cards.subj);resetDeck();viewTerms();});
  document.querySelectorAll("[data-ct]").forEach(b=>b.onclick=()=>{S.cards.topic=b.dataset.ct;resetDeck();viewTerms();});
  $("#card").onclick=()=>{S.cards.flipped=!S.cards.flipped;viewTerms();};
  const next=()=>{ S.cards.i++; S.cards.flipped=false; if(S.cards.i>=S.cards.order.length) resetDeck(); viewTerms(); };
  $("#know").onclick=()=>{S.known.add(sk+"|"+t.la);store.set("known2",[...S.known]);srMark(sk+"|t|"+t.la,true);next();};
  $("#again").onclick=next;
  $("#resetKnown").onclick=()=>{d.forEach(x=>S.known.delete(sk+"|"+x.la));store.set("known2",[...S.known]);resetDeck();viewTerms();};
  $("#toTest").onclick=e=>{ e.preventDefault(); location.hash="#test"; setTimeout(()=>startQuiz("t",sk,S.cards.topic),0); };
}

/* ---------------- 2. Test: takrorlash (Leitner) ---------------- */
const SR=store.get("sr",{});
let srTimer=null;
function srSave(){ clearTimeout(srTimer); srTimer=setTimeout(()=>store.set("sr",SR),300); }
function srMark(key,ok){ const st=SR[key]||[0,0]; SR[key]=[ok?Math.min(5,st[0]+1):0,Date.now()]; srSave(); }
function srPick(items,n){
  const now=Date.now();
  return items.map(it=>{ const st=SR[it.key]; const b=st?st[0]:-1; const days=st?(now-st[1])/864e5:99;
      return {it,p:b*2+Math.random()*2.5-Math.min(2.5,days/(1+Math.max(b,0)))}; })
    .sort((a,b)=>a.p-b.p).slice(0,n).map(x=>x.it);
}
const mastered=keys=>keys.filter(k=>SR[k]&&SR[k][0]>=3).length;
const QN=30;
const LEGACY={"Anatomiya":"anat","Biologiya":"bio","Lotin tili":"anat","Kimyo":"kim","Boshqa":"kasb"};
const subjKeyOf=name=>LEGACY[name]||QB.order.find(k=>QB.subj[k].name===name||k===name)||"kasb";
function termItems(sk,topic){ return termPool(sk,topic).map(t=>({kind:"t",sk,tn:t.tn,la:t.la,uz:t.uz,key:sk+"|t|"+t.la})); }
function qItems(sk,topic){ const s=QB.subj[sk]; const out=[];
  s.topics.forEach(tp=>{ if(topic!=="all"&&String(tp.n)!==String(topic)) return; tp.qs.forEach(r=>out.push({kind:"q",sk,tn:tp.n,r,key:sk+"|q|"+r[0]})); });
  if(topic==="all"||topic==="shared") S.shared.filter(q=>subjKeyOf(q.subject)===sk).forEach(q=>out.push({kind:"s",sk,q,key:"sh|"+q.id}));
  if(topic==="shared") return out.filter(x=>x.kind==="s");
  return out; }
function buildQ(it){
  const s=QB.subj[it.sk];
  if(it.kind==="t"){
    const tp=s.topics.find(x=>x.n===it.tn); let pool=tp.terms.filter(r=>r[0]!==it.la);
    if(pool.length<3) pool=pool.concat(s.topics.flatMap(x=>x.terms).filter(r=>r[0]!==it.la));
    const fwd=Math.random()<.6; const ans=fwd?it.uz:it.la; const seen=new Set([ans]); const wrong=[];
    for(const r of shuffle(pool)){ const v=fwd?r[1]:r[0]; if(!seen.has(v)){ seen.add(v); wrong.push(v); } if(wrong.length===3) break; }
    const opts=shuffle([ans,...wrong]);
    const q=fwd?`<em class="${s.termLabel==="Lotincha"?"":"plain"}">${esc(it.la)}</em> — ${termLabelUz(s)} qaysi?`
               :`<b>«${esc(it.uz)}»</b> — ${s.termLabel==="Lotincha"?"lotincha nomi":s.termLabel==="Inglizcha"?"inglizcha nomi":"qaysi atama"}${s.termLabel==="Lotincha"||s.termLabel==="Inglizcha"?" qaysi?":"?"}`;
    return {key:it.key,label:`${s.name.split(".")[0]} · ${tp.n}-mavzu atamasi`,q,html:true,options:opts,answer:opts.indexOf(ans),note:`${it.la} — ${it.uz}`};
  }
  if(it.kind==="q"){
    const r=it.r; const opts=shuffle(r.slice(1,5).filter(Boolean));
    return {key:it.key,label:`${s.name.split(".")[0]} · ${it.tn}-mavzu`,q:r[0],options:opts,answer:opts.indexOf(r[1]),note:r[5]||""};
  }
  const q=it.q; const idx=shuffle(q.options.map((o,i)=>i).filter(i=>q.options[i]!=null&&q.options[i]!==""));
  return {key:it.key,label:`${s.name.split(".")[0]} · kursdosh savoli`,q:q.q,options:idx.map(i=>q.options[i]),answer:idx.indexOf(q.answer),note:q.note||""};
}
function startQuiz(kind,sk,topic){
  const items=kind==="t"?termItems(sk,topic):qItems(sk,topic);
  if(!items.length) return;
  const qs=shuffle(srPick(items,topic==="all"?QN:items.length)).map(buildQ);
  const s=QB.subj[sk];
  const title=(kind==="t"?"Atamalar":"Mavzuga oid test")+" · "+(topic==="all"?"barcha mavzular":topic==="shared"?"kursdoshlar savollari":topic+"-mavzu");
  S.quiz={kind,sk,topic,title,subjName:s.name,qs,i:0,correct:0,picked:null,done:false,saved:null,wrong:[]};
  S.tnav.subj=sk; viewTest();
}
function rowBtn(attr,title,sub,keys,sc){
  const m=mastered(keys), n=keys.length;
  return `<button class="trow" ${attr} style="--sc:${sc}"><span class="tt"><b>${title}</b><small>${sub}</small>
    <span class="tbar"><i style="width:${n?m/n*100:0}%"></i></span></span><span class="tgo">${n?Math.round(m/n*100):0}%</span></button>`;
}
function viewTest(){
  const z=S.quiz;
  if(z&&z.done){
    const pct=Math.round(z.correct/z.qs.length*100);
    $("#view").innerHTML=`
      <div class="card result">
        <h2>${esc(z.subjName)}</h2><p class="lede" style="margin-top:-6px">${esc(z.title)}</p>

        <p class="lede" id="saveMsg">${z.saved===true?`+${z.correct} ball reytingga qo'shildi.`:z.saved===false?"Ball saqlanmadi: reyting faqat tasdiqlangan foydalanuvchilar uchun.":"Ball saqlanmoqda…"}</p>
        <div class="row" style="width:100%"><button class="btn" id="back">Mavzular</button><button class="btn primary" id="again">Qayta ishlash</button></div>
      </div>
      ${z.wrong.length?`<div class="sec"><h2>Xatolar ustida ishlash · ${z.wrong.length}</h2><div class="card list wrongs">${z.wrong.map(w=>`<div class="li"><div class="t"><div>${w.html?w.q:esc(w.q)}</div><small>To'g'ri javob: <b style="color:var(--ok)">${esc(w.options[w.answer])}</b>${w.note&&!w.note.includes(w.options[w.answer])?" · "+esc(w.note):""}</small></div></div>`).join("")}</div></div>`:""}`;
    $("#back").onclick=()=>{S.quiz=null;viewTest();};
    $("#again").onclick=()=>startQuiz(z.kind,z.sk,z.topic);
    return;
  }
  if(z){
    const q=z.qs[z.i]; const answered=z.picked!=null;
    $("#view").innerHTML=`
      <div class="qhead"><span>${esc(q.label)}</span><span class="sc">${z.i+1}/${z.qs.length} · ✓${z.correct}</span></div>
      <div class="bar"><i style="width:${z.i/z.qs.length*100}%"></i></div>
      <div class="qtext">${q.html?q.q:esc(q.q)}</div>
      <div class="opts">${q.options.map((o,i)=>{
        let cls=""; if(answered){ if(i===q.answer) cls="right"; else if(i===z.picked) cls="wrong"; }
        return `<button class="opt ${cls}" data-i="${i}" ${answered?"disabled":""}><span class="k">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`;}).join("")}</div>
      ${answered&&q.note&&q.note!==q.options[q.answer]?`<p class="explain">${esc(q.note)}</p>`:""}
      ${answered?`<button class="btn vein" id="next">${z.i+1<z.qs.length?"Keyingi savol":"Natijani ko'rish"}</button>`:`<button class="btn ghost" id="quit">Testni to'xtatish</button>`}`;
    document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ if(z.picked!=null) return; z.picked=+b.dataset.i; const ok=z.picked===q.answer;
      if(ok) z.correct++; else z.wrong.push(q); srMark(q.key,ok); viewTest(); });
    if(answered) $("#next").onclick=()=>{ z.i++; z.picked=null; if(z.i>=z.qs.length){ z.done=true; saveScore(z); } viewTest(); };
    else $("#quit").onclick=()=>{S.quiz=null;viewTest();};
    return;
  }
  const sk=S.tnav.subj;
  if(sk&&QB.subj[sk]){
    const s=QB.subj[sk], sc=SC[sk];
    const tAll=termItems(sk,"all").map(x=>x.key), qAll=qItems(sk,"all").map(x=>x.key);
    const shared=qItems(sk,"shared");
    $("#view").innerHTML=`
      <a class="back" href="#test" id="tback"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="m15 6-6 6 6 6"/></svg>Fanlar</a>
      <div class="titlebar"><h1>${esc(s.name)}</h1><p class="lede">${tAll.length} ta atama · ${qAll.length} ta savol. Mavzu testida o'sha mavzuning barcha savollari, aralash testda ${QN} ta savol beriladi; xato qilinganlar tez-tez qaytadi. Foiz — o'zlashtirilgan qism.</p></div>
      <div class="sec"><h2>1. Atamalar${s.termLabel==="Lotincha"?" (lotincha — o'zbekcha)":s.termLabel==="Inglizcha"?" (inglizcha — o'zbekcha)":""}</h2>
        <div class="card list tlist">${rowBtn(`data-go="t:all"`,"Barcha atamalar (aralash)",`${tAll.length} ta atama`,tAll,sc)}
          ${s.topics.filter(t=>t.terms.length).map(t=>rowBtn(`data-go="t:${t.n}"`,`${t.n}-mavzu atamalari`,`${esc(t.t)} · ${t.terms.length} ta`,termItems(sk,t.n).map(x=>x.key),sc)).join("")}</div></div>
      <div class="sec"><h2>2. Mavzuga oid testlar</h2>
        <div class="card list tlist">${rowBtn(`data-go="q:all"`,"Barcha mavzular (aralash)",`${qAll.length} ta savol`,qAll,sc)}
          ${s.topics.filter(t=>t.qs.length).map(t=>rowBtn(`data-go="q:${t.n}"`,`${t.n}-mavzu`,`${esc(t.t)} · ${t.qs.length} ta`,qItems(sk,t.n).map(x=>x.key),sc)).join("")}
          ${shared.length?rowBtn(`data-go="q:shared"`,"Kursdoshlar savollari",`${shared.length} ta savol`,shared.map(x=>x.key),sc):""}</div></div>`;
    $("#tback").onclick=e=>{e.preventDefault();S.tnav.subj=null;viewTest();};
    document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{ const [k,t]=b.dataset.go.split(":"); startQuiz(k,sk,t); });
    return;

  const tiles=QB.order.map(k=>{ const s=QB.subj[k]; const keys=termItems(k,"all").map(x=>x.key).concat(qItems(k,"all").map(x=>x.key)); const m=mastered(keys);
    return `<button class="subj" data-s="${k}" style="--sc:${SC[k]}"><span class="ic">${SUBJ_IC[k]}</span><b>${esc(s.name)}</b><small>${termItems(k,"all").length} atama · ${qItems(k,"all").length} savol</small>
      <span class="tbar"><i style="width:${keys.length?m/keys.length*100:0}%"></i></span></button>`; }).join("");
  $("#view").innerHTML=`
    <div class="titlebar"><h1>Testlar</h1><p class="lede">Fanni tanlang. Ichida atamalar va har bir mavzu bo'yicha alohida testlar bor. To'g'ri javoblar reytingdagi ballingizga qo'shiladi.</p></div>
    <div class="subjects">${tiles}</div>${statusNote()}`;
  document.querySelectorAll("[data-s]").forEach(el=>el.onclick=()=>{ S.tnav.subj=el.dataset.s; viewTest(); $("#main").scrollTop=0; });

async function saveScore(z){
  if(!S.db||!S.uid){ z.saved=false; return; }
  try{
    const ref=S.db.doc("scores/"+S.uid); const snap=await ref.get(); const o=snap.exists?snap.data():{};
    await ref.set({points:(o.points||0)+z.correct, tests:(o.tests||0)+1, answered:(o.answered||0)+z.qs.length,
      best:Math.max(o.best||0,Math.round(z.correct/z.qs.length*100)), updatedAt:new Date().toISOString()});
    z.saved=true;
  }catch(e){ z.saved=false; }
  if(S.quiz===z&&route()==="test") viewTest();
}

function viewAdd(){
  const mine=S.shared.filter(q=>q.author===S.uid);
  const draft=store.get("draft",{subject:SUBJECTS[0],q:"",options:["","","",""],answer:0,note:""});
  $("#view").innerHTML=`
    <div class="titlebar"><h1>Savol qo'shish</h1><p class="lede">Qo'shgan savolingiz darhol butun guruhning test bankiga tushadi. To'g'ri javobni belgilashni unutmang.</p></div>
    ${S.db?"":statusNote()}
    <form id="qf" class="card">
      <label for="f-subj">Fan<select id="f-subj">${SUBJECTS.map(s=>`<option ${s===draft.subject?"selected":""}>${s}</option>`).join("")}</select></label>
      <label for="f-q">Savol<textarea id="f-q" maxlength="400" placeholder="Masalan: Qaysi suyak bosh suyagining yuz qismiga kiradi?">${esc(draft.q)}</textarea></label>
      <fieldset><legend>Javob variantlari — to'g'risini belgilang</legend>
        ${[0,1,2,3].map(i=>`<div class="optin"><input type="radio" name="ans" id="f-a${i}" value="${i}" ${draft.answer===i?"checked":""} aria-label="${"ABCD"[i]} to'g'ri javob">
          <input type="text" id="f-o${i}" maxlength="140" placeholder="${"ABCD"[i]} variant${i>1?" (ixtiyoriy)":""}" value="${esc(draft.options[i])}"></div>`).join("")}
      </fieldset>
      <label for="f-note">Izoh (ixtiyoriy)<input type="text" id="f-note" maxlength="200" placeholder="Nega bu javob to'g'ri" value="${esc(draft.note)}"></label>
      <button class="btn primary" type="submit" id="f-send" ${S.db?"":"disabled"}>Test bankiga qo'shish</button>
      <div class="formmsg ${S.flashAt&&Date.now()-S.flashAt<6000?"ok":""}" id="f-msg" role="status">${S.flashAt&&Date.now()-S.flashAt<6000?"Qo'shildi! Savolingiz endi test bankida.":""}</div>
    </form>
    <div style="display:flex;flex-direction:column;gap:10px"><h2>Mening savollarim · ${mine.length}</h2>
      <div class="card list">${mine.length?mine.map(q=>`<div class="li"><div class="t"><div>${esc(q.q)}</div><small>${esc(q.subject)} · to'g'ri: ${esc(q.options[q.answer])}</small></div><button class="del" data-del="${esc(q.id)}">O'chirish</button></div>`).join("")
        :`<div class="empty">Hali savol qo'shmagansiz. Birinchi savolingiz kursdoshlarga katta yordam bo'ladi.</div>`}</div></div>`;
  const read=()=>({subject:$("#f-subj").value,q:$("#f-q").value,options:[0,1,2,3].map(i=>$("#f-o"+i).value),
    answer:+(document.querySelector("input[name=ans]:checked")?.value??0),note:$("#f-note").value});
  $("#qf").oninput=()=>store.set("draft",read());
  $("#qf").onsubmit=async e=>{
    e.preventDefault(); const v=read(); const msg=$("#f-msg"); msg.className="formmsg";
    const opts=v.options.map(s=>s.trim());
    if(!v.q.trim()){msg.className="formmsg err";msg.textContent="Savol matnini yozing.";return;}
    if(!opts[0]||!opts[1]){msg.className="formmsg err";msg.textContent="Kamida A va B variantlarini to'ldiring.";return;}
    if(!opts[v.answer]){msg.className="formmsg err";msg.textContent="Belgilangan to'g'ri javob bo'sh. Uni to'ldiring yoki boshqa variantni belgilang.";return;}
    const clean=[];let ans=0; opts.forEach((o,i)=>{ if(o){ if(i===v.answer) ans=clean.length; clean.push(o);} });
    $("#f-send").disabled=true;
    try{
      await S.db.collection("questions").add({subject:v.subject,q:v.q.trim(),options:clean,answer:ans,note:v.note.trim(),author:S.uid,createdAt:new Date().toISOString()});
      store.set("draft",{subject:v.subject,q:"",options:["","","",""],answer:0,note:""});
      S.flashAt=Date.now(); viewAdd();
    }catch(err){ $("#f-send").disabled=false; msg.className="formmsg err";
      msg.textContent=err&&err.code==="not_granted"?"Sizda yozish huquqi yo'q. Ilova egasidan sizga foydalanish huquqini berishini so'rang.":"Saqlab bo'lmadi. Internetni tekshirib, qayta urinib ko'ring."; }
  };
  document.querySelectorAll("[data-del]").forEach(b=>{
    let armed=false;
    b.onclick=async()=>{ if(!armed){armed=true;b.textContent="Aniqmi?";setTimeout(()=>{armed=false;b.textContent="O'chirish"},3000);return;}
      try{ await S.db.doc("questions/"+b.dataset.del).delete(); }catch(e){ b.textContent="Xato"; } };
  });
}

    <div class="titlebar"><h1>Reyting</h1><p class="lede">Testlardagi to'g'ri javoblar. Har bir to'g'ri javob — 1 ball.</p></div>

    ${podium}

        <div class="t"><div>${esc(nm(r.id))}${r.id===S.uid?" (siz)":""}</div><small>${r.tests||0} ta test · eng yaxshi ${r.best||0}%</small></div>
        <div class="pts">${r.points||0}<small>ball</small></div></div>`).join("")

function statusNote(){
  if(S.db) return "";

/* ================= Fanlar, uyga vazifa, darsliklar ================= */
const SUBJ={anat:"Odam anatomiyasi",kim:"Tibbiy kimyo",bio:"Tibbiy biologiya. Umumiy genetika",tarix:"O'zbekistonning eng yangi tarixi",til:"Tibbiyotda xorijiy til",kasb:"Tibbiyot kasbiga kirish"};
const SUBJ_IC={anat:"An",kim:"Ki",bio:"Bi",tarix:"Ta",til:"Xt",kasb:"Tk"};
function todayYMD(){ return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Tashkent",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date()); }
function addDays(ymd,n){ const d=new Date(ymd+"T00:00:00Z"); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function wdOf(ymd){ return (new Date(ymd+"T00:00:00Z").getUTCDay()+6)%7; }
function fmtDate(ymd){ const d=new Date(ymd+"T00:00:00Z"); return `${WEEK[wdOf(ymd)]}, ${d.getUTCDate()}-${MONTHS[d.getUTCMonth()]}`; }
// next lesson of a subject: today counts only if that lesson has not ended yet; strict=true skips today
function nextLesson(key,strict){
  const t=todayYMD(), n=nowTash();
  for(let i=strict?1:0;i<=14;i++){ const d=addDays(t,i), wd=wdOf(d);
    const ls=LESSONS.filter(l=>l.key===key&&l.d===wd).sort((a,b)=>a.p-b.p);
    for(const l of ls){ if(i===0&&n.min>=toMin(PARAS[l.p][1])) continue; return {date:d,lesson:l}; } }
  return null;
}
function upcoming(key,count){ const t=todayYMD(); const out=[];
  for(let i=1;i<=21&&out.length<count;i++){ const d=addDays(t,i), wd=wdOf(d);
    LESSONS.filter(l=>l.key===key&&l.d===wd).sort((a,b)=>a.p-b.p).forEach(l=>{ if(out.length<count) out.push({date:d,lesson:l}); }); }
  return out; }
function hwLesson(h){ const wd=wdOf(h.due); return LESSONS.find(x=>x.key===h.subject&&x.d===wd&&(!h.para||x.p===h.para))||LESSONS.find(x=>x.key===h.subject&&x.d===wd); }
const typeDat={"Ma'ruza":"ma'ruzasiga","Amaliy":"amaliy darsiga","Seminar":"seminariga"};
function relDay(ymd){ const t=todayYMD(); return ymd===t?"Bugun":ymd===addDays(t,1)?"Ertaga":fmtDate(ymd); }
function currentHw(key){ const t=todayYMD(); return S.homework.filter(h=>h.subject===key&&h.due>=t).sort((a,b)=>a.due.localeCompare(b.due)||(a.para||0)-(b.para||0)||(b.createdAt||"").localeCompare(a.createdAt||"")); }
function hwBanner(){
  const t=todayYMD(), tm=addDays(t,1); const n=nowTash();
  const items=S.homework.filter(h=>SUBJ[h.subject]&&(h.due===tm||h.due===t)).filter(h=>{
    if(h.due!==t) return true; const l=hwLesson(h); return l&&n.min<toMin(PARAS[l.p][1]); });
  return items.map(h=>{ const l=hwLesson(h); const today=h.due===t;
    return `<a class="alert ${today?"today":""}" href="#fan-${h.subject}">
      <span class="h"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>${today?"Bugun":"Ertaga"} dars · uyga vazifani bajaring</span>
      <span class="s">${esc(SUBJ[h.subject])}${l?` · ${l.type} · ${PARAS[l.p][0]}, ${l.room}`:""}</span>
      ${h.topic?`<span class="m">Mavzu: ${esc(h.topic)}</span>`:""}
      <span class="tx">${esc(h.text)}</span></a>`; }).join("");
}
function viewSubjects(){
  const tiles=Object.keys(SUBJ).map(k=>{
    const nx=nextLesson(k,false); const hw=currentHw(k).length; const mt=S.materials.filter(m=>m.subject===k).length;
    return `<a class="fan" href="#fan-${k}" style="--sc:${SC[k]}"><span class="ic">${SUBJ_IC[k]}</span>
      <span class="t"><b>${esc(SUBJ[k])}</b><small>${nx?`Keyingi dars: ${relDay(nx.date)}, ${PARAS[nx.lesson.p][0]}`:"Jadvalda yo'q"}</small>
      <span class="badges">${hw?`<span class="badge hw">Uyga vazifa bor</span>`:""}<span class="badge">${mt+(window.libItems?libItems(k).length:0)} ta darslik</span></span></span>
      <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg></a>`; }).join("");
  $("#view").innerHTML=`${hwBanner()}
    <div class="titlebar"><h1>Fanlar</h1><p class="lede">Fanni bosing: uyga vazifa va darsliklar shu yerda.</p></div>
    ${S.db?"":statusNote()}
    <div class="fan-grid">${tiles}</div>`;
}
const fmtSize=b=>!b?"":b>1048576?(b/1048576).toFixed(1)+" MB":Math.max(1,Math.round(b/1024))+" KB";
function extOf(m){ if(m.kind==="link") return "LINK"; const f=(m.filename||"").split(".").pop(); return f&&f.length<=4?f.toUpperCase():"FAYL"; }
function viewSubject(key){
  const nx=nextLesson(key,false); const hws=currentHw(key); const mats=S.materials.filter(m=>m.subject===key).sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""));

      <div class="wk">${weekly.map(l=>`<div class="wk-r"><span class="wk-d">${DAYS[l.d][0]}</span><span class="wk-t">${PARAS[l.p][0]}</span><span class="type" style="--sc:${SC[key]}">${l.type}</span><span class="pill room">${l.room}</span><span class="wk-w">${esc(l.who)}</span></div>`).join("")}</div>
      ${nx?`<div class="lede" style="font-size:13.5px">Keyingi dars: <b style="color:var(--ink)">${relDay(nx.date)}, ${PARAS[nx.lesson.p][0]} · ${nx.lesson.type}</b></div>`:""}</div>
    <div class="sec"><div class="sec-h"><h2>Uyga vazifa</h2></div>
      ${hws.length?hws.map(h=>{const l=hwLesson(h);return `<div class="card hw"><span class="due">${relDay(h.due)}${l?` · ${typeDat[l.type]||"darsiga"} (${PARAS[l.p][0]})`:" darsigacha"}</span>${h.topic?`<span class="topic">${esc(h.topic)}</span>`:""}<span class="txt">${esc(h.text)}</span>
        <span class="by"><span>${esc(S.names[h.author]||"Kursdosh")} yozdi</span>${(h.author===S.uid||S.isOwner)?`<button class="mini red" data-delhw="${esc(h.id)}">O'chirish</button>`:""}</span></div>`}).join("")
        :`<div class="card empty">Hozircha uyga vazifa yo'q.</div>`}
      ${S.db?"":`<div class="note"><b>Vazifa yozish yopiq.</b> Buning uchun hisobingizga kiring va admin tasdiqlashini kuting.</div>`}
      ${S.db?`<form class="card compact" id="hwf">
        <fieldset><legend>Qaysi darsga?</legend><div class="pick">${opts.map((o,i)=>`<button type="button" class="pk" data-pk="${i}" aria-pressed="${i===S.hwPick}"><b>${relDay(o.date)}</b><span>${o.lesson.type} · ${PARAS[o.lesson.p][0]}</span></button>`).join("")}</div></fieldset>
        <label for="hw-topic">Mavzu (ixtiyoriy)<input type="text" id="hw-topic" maxlength="120" placeholder="Masalan: Bosh suyagi" value="${esc(draft.topic)}"></label>
        <label for="hw-text">Vazifa<textarea id="hw-text" maxlength="800" placeholder="Nima qilish kerak: o'qish, chizish, yodlash...">${esc(draft.text)}</textarea></label>
        <button class="btn primary" type="submit" id="hw-send">Vazifani yozish</button>
        <div class="formmsg" id="hw-msg" role="status"></div></form>`:""}
    </div>
    <div class="sec"><div class="sec-h"><h2>Darsliklar va ma'ruzalar</h2></div>
      ${libSection(key)}
      ${mats.length||S.isOwner?`<h2 style="margin-top:6px">Admin qo'shgan · ${mats.length}</h2>`:""}
      <div class="card list" ${mats.length?"":'style="display:none"'}>${mats.length?mats.map(m=>`<div class="file" style="--sc:${SC[key]}"><span class="fi">${extOf(m)}</span>
        <div class="t"><div>${esc(m.title)}</div><small>${m.kind==="link"?"Havola":esc(fmtSize(m.size))}</small></div>
        <div class="acts">${m.kind==="file"?`<button class="mini blue" data-open="${esc(m.id)}">Ochish</button>`:`<a class="mini blue" href="${esc(m.url)}" target="_blank" rel="noopener">Ochish</a>`}
        ${S.isOwner?`<button class="mini red" data-delm="${esc(m.id)}">✕</button>`:""}</div></div>`).join("")
        :`<div class="empty">Hali darslik qo'shilmagan.</div>`}</div>
      ${S.isOwner&&S.db?`<form class="card compact" id="mf">
        <h2>Darslik qo'shish (admin)</h2>
        <label for="m-title">Nomi<input type="text" id="m-title" maxlength="140" placeholder="Masalan: Sapin. Odam anatomiyasi, 1-tom"></label>
        <label for="m-file">Fayl biriktirish (PDF, PowerPoint, Word · 25 MB gacha)<input type="file" id="m-file" class="fileinp"></label>

        <label for="m-link">Havola (Google Drive, Telegram)<input type="text" id="m-link" placeholder="https://..."></label>
        <button class="btn vein" type="submit" id="m-send">Qo'shish</button>

    </div>`;
  document.querySelectorAll("[data-lib]").forEach(b=>b.onclick=async()=>{ const it=(window.libItems?libItems(key):[]).find(x=>x.id===b.dataset.lib); if(!it||b.disabled) return;

  const hwf=$("#hwf");
  if(hwf){

    if(S.flashHw&&Date.now()-S.flashHw<5000){ const m=$("#hw-msg"); m.className="formmsg ok"; m.textContent="Vazifa yozildi. Darsdan bir kun oldin hammaga qizil eslatma chiqadi."; }

  const mf=$("#mf");

    if(file&&file.size>25*1048576){msg.className="formmsg err";msg.textContent="Fayl 25 MB dan katta. Uni Google Drive yoki Telegram'ga yuklab, havolasini qo'ying.";return;}
    $("#m-send").disabled=true; msg.textContent=file?"Yuklanmoqda…":"";

      if(file){ const up=await window.fileUpload(file,f=>{ msg.textContent="Yuklanmoqda… "+Math.round(f*100)+"%"; });
        await window.fileSaveMeta(up.id,{subject:key,title,kind:"file",url:"file",filename:file.name,size:file.size,contentType:file.type||"",chunks:up.chunks,author:S.uid,createdAt:new Date().toISOString()}); }
      else await S.db.collection("materials").add({subject:key,title,kind:"link",url:link,author:S.uid,createdAt:new Date().toISOString()});
      viewSubject(key); const m=$("#m-msg"); if(m){m.className="formmsg ok";m.textContent="Darslik qo'shildi.";}
    }catch(err){ $("#m-send").disabled=false; msg.className="formmsg err";

const CHUNK = 700000;
const toB64 = u8 => { let s = ""; for (let i = 0; i < u8.length; i += 32768) s += String.fromCharCode.apply(null, u8.subarray(i, i + 32768)); return btoa(s); };
const fromB64 = b => { const s = atob(b); const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; };
const capPlug = n => { const C = window.Capacitor; return C && ((C.Plugins && C.Plugins[n]) || (C.registerPlugin && C.registerPlugin(n))); };
const isNative = () => { const C = window.Capacitor; return !!(C && C.isNativePlatform && C.isNativePlatform()); };
const MIME = { pdf: "application/pdf", ppt: "application/vnd.ms-powerpoint", pptx: "application/vnd.openxmlformats-officedocument.presentationml.presentation", doc: "application/msword", docx: "application/vnd.openxmlformats-officedocument.wordprocessingml.document", xls: "application/vnd.ms-excel", xlsx: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", jpg: "image/jpeg", jpeg: "image/jpeg", png: "image/png", txt: "text/plain", djvu: "image/vnd.djvu", epub: "application/epub+zip" };
const mimeOf = m => m.contentType || MIME[(m.filename || "").split(".").pop().toLowerCase()] || "application/octet-stream";
window.fileUpload = async (file, prog) => {
  const buf = new Uint8Array(await file.arrayBuffer()); const n = Math.max(1, Math.ceil(buf.length / CHUNK));
  const ref = doc(collection(fs, "materials"));
  for (let i = 0; i < n; i++) {
    await setDoc(doc(fs, `materials/${ref.id}/chunks/${String(i).padStart(4, "0")}`), { i, d: toB64(buf.subarray(i * CHUNK, (i + 1) * CHUNK)) });
    prog && prog((i + 1) / n);
  }
  return { id: ref.id, chunks: n };
};
window.fileSaveMeta = (id, data) => setDoc(doc(fs, "materials/" + id), data);
async function fetchChunks(m, prog) {
  const snap = await getDocs(query(collection(fs, `materials/${m.id}/chunks`), orderBy("i")));
  const out = snap.docs.map(d => d.data().d); prog && prog(1); return out;
}
window.fileDelete = async m => {
  const snap = await getDocs(collection(fs, `materials/${m.id}/chunks`));
  for (let i = 0; i < snap.docs.length; i += 400) { const b = writeBatch(fs); snap.docs.slice(i, i + 400).forEach(d => b.delete(d.ref)); await b.commit(); }
  await deleteDoc(doc(fs, "materials/" + m.id));
};
window.fileOpen = async (m, prog) => {
  const name = (m.filename || m.title || "fayl").replace(/[\\/:*?"<>|]+/g, "_");
  const type = mimeOf(m);
  if (isNative()) {
    const FS = capPlug("Filesystem");
    if (FS) {
      const path = `darsliklar/${m.id}/${name}`; let have = false;
      try { await FS.stat({ path, directory: "CACHE" }); have = true; } catch (e) {}
      if (!have) {
        const parts = await fetchChunks(m, prog); const tmp = `darsliklar/${m.id}/.yuklanmoqda`;
        for (let i = 0; i < parts.length; i++) {
          if (i === 0) await FS.writeFile({ path: tmp, data: parts[i], directory: "CACHE", recursive: true });
          else await FS.appendFile({ path: tmp, data: parts[i], directory: "CACHE" });
          prog && prog((i + 1) / parts.length);
        }
        await FS.rename({ from: tmp, to: path, directory: "CACHE", toDirectory: "CACHE" });
      }
      const { uri } = await FS.getUri({ path, directory: "CACHE" });
      const FO = capPlug("FileOpener");
      try { if (!FO) throw 0; await FO.open({ filePath: uri, contentType: type, openWithDefault: true }); return; }
      catch (e) { const SH = capPlug("Share"); if (SH) { await SH.share({ title: m.title, files: [uri] }); return; } throw e; }
    }
  }
  const parts = await fetchChunks(m, prog);
  const blob = new Blob(parts.map(fromB64), { type });
  const url = URL.createObjectURL(blob); const a = document.createElement("a");
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);

async function pinKey(k) {

const LIB = { key: null, list: null, loading: false, err: null };
const b64u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function libKey() {
  if (LIB.key || !S.fileKeyB64) return LIB.key;
  LIB.key = await crypto.subtle.importKey("raw", b64u8(S.fileKeyB64), "AES-GCM", false, ["decrypt"]);
  return LIB.key;
}
async function libDecrypt(buf) {

  return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: u.slice(0, 12) }, await libKey(), u.slice(12)));
}
async function libLoad() {

    const r = await fetch("files/catalog.bin", { cache: "no-cache" });
    if (!r.ok) throw new Error("HTTP " + r.status);

  } catch (e) { LIB.err = String(e && e.message || e); }

  const parts = [];
  for (let n = 0; n < it.parts; n++) {
    const r = await fetch(`files/${it.id}/${n}.bin`);
    if (!r.ok) throw new Error("HTTP " + r.status);
    let buf;
    if (r.body && r.body.getReader) {
      const rd = r.body.getReader(); const chunks = []; let got = 0; const exp = Math.min(25165852, it.size - n * 25165824 + 28);
      for (;;) { const { done, value } = await rd.read(); if (done) break; chunks.push(value); got += value.length; prog && prog((n + Math.min(1, got / exp)) / it.parts); }

window.libOpen = async (it, prog) => {
  if (isNative()) {
    const FS = capPlug("Filesystem");
    if (FS) {
      const path = `kutubxona/${it.id}.pdf`; let have = false;
      try { const st = await FS.stat({ path, directory: "CACHE" }); have = st && st.size === it.size; } catch (e) {}

        for (const p of parts) for (let o = 0; o < p.length; o += 3 * 1024 * 1024) {
          const data = u8ToB64(p.subarray(o, o + 3 * 1024 * 1024));
          if (first) { await FS.writeFile({ path: tmp, data, directory: "CACHE", recursive: true }); first = false; }
          else await FS.appendFile({ path: tmp, data, directory: "CACHE" });
        }

async function unwrapFileKey(pass) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);

      let p = await LN.checkPermissions();

      if (p.display !== "granted") return;
      const pend = await LN.getPending(); if (pend.notifications.length) await LN.cancel({ notifications: pend.notifications.map(n => ({ id: n.id })) });
      const t = todayYMD(), now = Date.now(), list = [];
      for (let i = 1; i <= 14; i++) {
        const d = addDays(t, i), wd = wdOf(d); const ls = LESSONS.filter(l => l.d === wd).sort((a, b) => a.p - b.p); if (!ls.length) continue;
        const prev = addDays(d, -1).split("-").map(Number); const at = new Date(prev[0], prev[1] - 1, prev[2], 20, 0);

        hws.forEach(h => lines.push(`Vazifa · ${SUBJ[h.subject] || ""}: ${h.topic ? h.topic + " — " : ""}${h.text}`));
        if (at.getTime() > now) list.push({ id: 1000 + i, title: hws.length ? `Ertaga ${ls.length} para · uyga vazifa bor!` : `Ertaga ${ls.length} para`, body: lines.join("\n"), largeBody: lines.join("\n"), schedule: { at, allowWhileIdle: true } });
        if (hws.length) { const dd = d.split("-").map(Number); const am = new Date(dd[0], dd[1] - 1, dd[2], 7, 0);
          if (am.getTime() > now) list.push({ id: 2000 + i, title: "Bugun dars · uyga vazifani unutmang", body: hws.map(h => `${SUBJ[h.subject] || ""}: ${h.text}`).join("\n"), largeBody: hws.map(h => `${SUBJ[h.subject] || ""}: ${h.text}`).join("\n"), schedule: { at: am, allowWhileIdle: true } }); }
