<!doctype html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Davolash 26-39</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,600;1,400;1,500&family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: mobile app shell — gradient-free header with today's date, scrolling view, floating pill tab bar.
   Atlas convention carried over: arterial red = accent, venous blue = secondary; each subject gets its own hue. */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --surface-2:#F6F8FA; --ink:#121A23; --muted:#5F6C79; --faint:#8C98A4; --line:#E1E6EC;
  --accent:#C42847; --accent-soft:#FBE7EB; --vein:#2D63A6; --vein-soft:#E4EDF8; --ok:#1E8A55; --ok-soft:#DFF3E8;
  --shadow:0 1px 2px rgba(18,26,35,.06),0 8px 24px -12px rgba(18,26,35,.18);
  --c-anat:#C42847; --c-kim:#C27A0E; --c-bio:#1E8A55; --c-tarix:#5B4BC4; --c-til:#0E8C8C; --c-kasb:#2D63A6;
  --f-latin:"Spectral",Georgia,"Times New Roman",serif;
  --f-ui:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1015; --surface:#141B22; --surface-2:#1A222B; --ink:#E8EEF4; --muted:#9AA7B4; --faint:#6E7B88; --line:#232D37;
  --accent:#F0607B; --accent-soft:#3B1C25; --vein:#7FB0EA; --vein-soft:#18283A; --ok:#4FCB8C; --ok-soft:#14301F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
  --c-anat:#F0607B; --c-kim:#E9A23B; --c-bio:#4FCB8C; --c-tarix:#9C90F0; --c-til:#3FC7C7; --c-kasb:#7FB0EA; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0B1015; --surface:#141B22; --surface-2:#1A222B; --ink:#E8EEF4; --muted:#9AA7B4; --faint:#6E7B88; --line:#232D37;
  --accent:#F0607B; --accent-soft:#3B1C25; --vein:#7FB0EA; --vein-soft:#18283A; --ok:#4FCB8C; --ok-soft:#14301F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
  --c-anat:#F0607B; --c-kim:#E9A23B; --c-bio:#4FCB8C; --c-tarix:#9C90F0; --c-til:#3FC7C7; --c-kasb:#7FB0EA; color-scheme:dark }

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--vein);outline-offset:2px;border-radius:8px}
.wrap{width:100%;max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#view>*{min-width:0;max-width:100%}

/* header */
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 6px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:38px;height:38px;border-radius:12px;background:var(--accent);display:grid;place-items:center;flex:none;box-shadow:0 6px 16px -6px var(--accent)}
.logo svg{width:22px;height:22px}
.brand-t{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand-t b{font-weight:800;font-size:17px;letter-spacing:-.01em}
.brand-t span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.datebox{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right;flex:none}
.datebox b{display:block;color:var(--ink);font-family:var(--f-ui);font-size:14px;font-weight:700}

main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
main .wrap{padding-block:12px 24px;display:flex;flex-direction:column;gap:16px}
#view{display:flex;flex-direction:column;gap:16px}
#sub:empty{display:none}
#view{animation:fade .22s ease}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
h1{font-weight:800;font-size:26px;line-height:1.15;margin:0;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0;font-weight:700}
p{margin:0}
.lede{color:var(--muted);max-width:60ch;font-size:14.5px}
.titlebar{display:flex;flex-direction:column;gap:4px}

.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}
.note{border-radius:16px;padding:12px 14px;font-size:13.5px;color:var(--muted);background:var(--surface-2);border:1px dashed var(--line)}
.note b{color:var(--ink)}

/* segmented day picker / chips */
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--surface);padding:4px;border-radius:16px;box-shadow:var(--shadow)}
.seg button{border:0;background:none;border-radius:12px;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button small{font-family:var(--f-mono);font-size:10.5px;font-weight:500;letter-spacing:.04em}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:2px}
.seg button:not(.today) .dot{visibility:hidden}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:700;white-space:nowrap;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip .n{font-family:var(--f-mono);font-size:11px;opacity:.75;margin-left:6px;font-weight:500}

/* schedule */
.now{padding:18px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.now .tag{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:8px}
.now .tag i{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 var(--accent);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
.now .hsubj{font-size:21px;font-weight:800;line-height:1.2;letter-spacing:-.01em}
.now .meta{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:700;background:var(--surface-2);color:var(--muted)}
.pill.room{background:var(--ink);color:var(--bg);font-family:var(--f-mono);font-weight:600}
.timeline{display:flex;flex-direction:column;gap:10px}
.lesson{display:grid;grid-template-columns:62px 1fr;gap:12px;align-items:stretch}
.lesson .t{display:flex;flex-direction:column;align-items:flex-end;padding-top:14px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.lesson .t b{font-size:14.5px;font-weight:600}
.lesson .t small{font-size:11.5px;color:var(--faint)}
.lesson .body{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:13px 14px 13px 16px;display:flex;flex-direction:column;gap:7px;position:relative;overflow:hidden;min-width:0}
.lesson .body::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--sc,var(--vein))}
.lesson .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lesson .para{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--sc,var(--muted))}
.lesson .name{font-weight:800;font-size:16px;line-height:1.3}
.lesson .who{font-size:13px;color:var(--muted)}
.lesson.free .body{background:transparent;box-shadow:none;border:1.5px dashed var(--line);padding-block:10px}
.lesson.free .body::before{display:none}
.lesson.free .name{font-weight:600;font-size:13.5px;color:var(--faint)}
.lesson.live .body{outline:2px solid var(--accent);outline-offset:-2px}
.lesson.past{opacity:.55}
.type{font-size:11px;font-weight:800;letter-spacing:.04em;padding:3px 8px;border-radius:999px;background:color-mix(in srgb,var(--sc) 14%,transparent);color:var(--sc)}
.daysum{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.daysum b{color:var(--ink)}

/* flashcard */
.specimen{background:var(--surface);border:0;border-radius:24px;box-shadow:var(--shadow);min-height:260px;display:flex;flex-direction:column;justify-content:space-between;padding:18px 20px 20px;text-align:left;width:100%;position:relative;overflow:hidden}
.specimen::after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:var(--accent-soft);opacity:.7}
.specimen>*{position:relative;z-index:1}
.specimen .top{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.specimen .top .cat{color:var(--accent);font-weight:600}
.specimen .latin{font-family:var(--f-latin);font-style:italic;font-weight:500;font-size:clamp(30px,8.5vw,44px);line-height:1.1;text-wrap:balance;word-break:break-word}
.specimen .uz{font-size:19px;font-weight:800;min-height:1.6em}
.specimen .hint{font-size:13px;color:var(--muted)}
.specimen.flipped .hint{visibility:hidden}
.specimen .uz.hidden{background:repeating-linear-gradient(90deg,var(--line) 0 12px,transparent 12px 16px);border-radius:6px;max-width:220px}
.row{display:flex;gap:10px}
.row>*{flex:1}
.btn{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:14px;padding:13px 14px;font-weight:800;font-size:15px}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 8px 18px -10px var(--accent)}
.btn.vein{background:var(--vein);color:var(--bg)}
.btn.ghost{background:transparent;box-shadow:none;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:default}
.btn:active{transform:scale(.98)}
.progress{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.bar{flex:1;height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .35s}

/* test */
.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.subj{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.subj .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--sc) 15%,transparent);color:var(--sc);font-weight:800;font-size:15px}
.subj b{font-size:15px;font-weight:800}
.subj small{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.subj.lat b{font-family:var(--f-latin);font-style:italic;font-size:18px;font-weight:500}
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);font-weight:700}
.qhead .sc{font-family:var(--f-mono)}
.qtext{font-size:19px;font-weight:800;line-height:1.35;text-wrap:pretty}
.qtext em{font-family:var(--f-latin);font-size:25px;font-weight:500}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:2px solid transparent;box-shadow:var(--shadow);border-radius:16px;padding:12px 14px;font-size:15.5px;font-weight:600;width:100%}
.opt .k{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:8px;width:28px;height:28px;display:grid;place-items:center;flex:none}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--accent);background:var(--accent-soft)}
.opt.wrong .k{background:var(--accent);color:#fff}
.opt[disabled]{cursor:default}
.explain{font-size:14px;color:var(--muted);background:var(--vein-soft);border-radius:14px;padding:10px 14px}
.result{padding:24px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.result .big{font-weight:800;font-size:60px;line-height:1;letter-spacing:-.03em}
.result .big small{font-size:24px;color:var(--muted)}

/* form */
form{display:flex;flex-direction:column;gap:14px;padding:18px}
label{display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:700}
input[type=text],select,textarea{border:1.5px solid var(--line);background:var(--surface-2);border-radius:12px;padding:11px 12px;font-weight:500;font-size:15px;width:100%}
input[type=text]:focus,select:focus,textarea:focus{border-color:var(--vein);outline:none}
textarea{min-height:80px;resize:vertical}
.optin{display:flex;gap:10px;align-items:center}
.optin input[type=radio]{width:22px;height:22px;accent-color:var(--ok);flex:none}
.optin input[type=text]{flex:1;min-width:0}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
legend{font-size:13.5px;font-weight:700;margin-bottom:6px}
.formmsg{font-size:14px;min-height:1.4em;font-weight:600}
.formmsg.ok{color:var(--ok)} .formmsg.err{color:var(--accent)}

.list{display:flex;flex-direction:column;overflow:hidden}
.li{display:flex;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .t{flex:1;min-width:0}
.li .t div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.li .t small{color:var(--muted);font-size:12.5px}
.li .del{border:0;background:var(--accent-soft);color:var(--accent);font-size:12.5px;font-weight:800;padding:6px 10px;border-radius:10px}

/* leaderboard */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:10px;align-items:end}
.pod{background:var(--surface);box-shadow:var(--shadow);border-radius:18px;padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.pod .av{width:44px;height:44px;font-size:17px}
.pod.p1{padding-top:20px;background:linear-gradient(var(--accent-soft),var(--surface))}
.pod.p1 .av{width:54px;height:54px;font-size:20px;box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--accent)}
.pod .nm{font-weight:800;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .pl{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.pod .pt{font-family:var(--f-mono);font-weight:600;font-size:15px}
.av{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff}
.lb .rank{font-family:var(--f-mono);font-size:13px;width:24px;color:var(--muted);flex:none}
.lb .pts{font-family:var(--f-mono);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.lb .pts small{display:block;font-size:10.5px;color:var(--muted);font-weight:500}
.lb .li.me{background:var(--vein-soft)}
.empty{padding:24px 16px;text-align:center;color:var(--muted);font-size:14px}
.empty a{color:var(--accent);font-weight:700}

/* tab bar */
nav{padding-bottom:max(10px,env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 35%)}
nav .wrap{padding-block:6px 0}
nav .bar5{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:6px}
nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;border-radius:16px;text-decoration:none;color:var(--faint);font-size:10.5px;font-weight:800;letter-spacing:.01em}
nav a svg{width:22px;height:22px}
nav a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}


/* study sub-tabs */
.subtabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface);padding:4px;border-radius:14px;box-shadow:var(--shadow)}
.subtabs a{text-align:center;text-decoration:none;color:var(--muted);font-weight:800;font-size:13px;padding:8px 0;border-radius:10px}
.subtabs a[aria-current="page"]{background:var(--ink);color:var(--bg)}

/* reminder banner */
.alert{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:18px;background:var(--accent);color:#fff;text-decoration:none;box-shadow:0 10px 24px -12px var(--accent)}
.alert.today{background:#C27A0E;box-shadow:0 10px 24px -12px #C27A0E}
.alert .h{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.9;display:flex;align-items:center;gap:8px}
.alert .h svg{width:16px;height:16px}
.alert .s{font-weight:800;font-size:17px;line-height:1.25}
.alert .tx{font-size:14px;line-height:1.45;background:rgba(255,255,255,.16);border-radius:12px;padding:8px 10px;white-space:pre-wrap;word-break:break-word}
.alert .m{font-size:12.5px;opacity:.9}

/* subjects (fanlar) */
.fan-grid{display:flex;flex-direction:column;gap:10px}
.fan{display:flex;gap:14px;align-items:center;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:14px;text-decoration:none;color:inherit;min-width:0}
.fan .ic{width:44px;height:44px;border-radius:14px;flex:none;display:grid;place-items:center;font-weight:800;font-size:17px;background:color-mix(in srgb,var(--sc) 15%,transparent);color:var(--sc)}
.fan .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.fan .t b{font-size:15.5px;font-weight:800;line-height:1.25}
.fan .t small{font-size:12.5px;color:var(--muted)}
.fan .badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:800;border-radius:999px;padding:3px 8px;background:var(--surface-2);color:var(--muted)}
.badge.hw{background:var(--accent-soft);color:var(--accent)}
.fan .chev{color:var(--faint);flex:none}
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--muted);font-weight:800;font-size:13.5px}
.fanhead{padding:18px;display:flex;flex-direction:column;gap:10px;border-top:5px solid var(--sc)}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:center}
.hw{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.hw .due{font-size:12px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.hw .topic{font-weight:800;font-size:15.5px}
.hw .txt{white-space:pre-wrap;word-break:break-word;font-size:14.5px}
.hw .by{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--faint)}
.mini{border:0;background:var(--surface-2);color:var(--muted);font-weight:800;font-size:12.5px;padding:7px 11px;border-radius:10px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.mini.red{background:var(--accent-soft);color:var(--accent)}
.mini.blue{background:var(--vein-soft);color:var(--vein)}
.file{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.file:first-child{border-top:0}
.file .fi{width:40px;height:44px;border-radius:9px;flex:none;display:grid;place-items:center;font-family:var(--f-mono);font-size:10.5px;font-weight:600;color:#fff;background:var(--sc,var(--vein))}
.file .t{flex:1;min-width:0}
.file .t div{font-weight:800;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .t small{font-size:12px;color:var(--muted)}
.file .acts{display:flex;gap:6px;width:100%;padding-left:52px}
form.compact{padding:14px;gap:10px}
input[type=file]{font-size:13.5px;width:100%}

/* group list */
.gstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gstat{background:var(--surface);box-shadow:var(--shadow);border-radius:16px;padding:12px;display:flex;flex-direction:column}
.gstat b{font-size:24px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.gstat small{font-size:12px;color:var(--muted);font-weight:700}
.search{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:14px;padding:12px 14px;width:100%;font-size:15px}
.st{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;color:inherit}
.st:first-child{border-top:0}
.st .ph{width:52px;height:68px;border-radius:12px;flex:none;object-fit:cover;background:var(--surface-2)}
.st .ph.none{display:grid;place-items:center;font-weight:800;color:#fff}
.st .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.st .t b{font-weight:800;font-size:15px;line-height:1.25}
.st .t small{font-size:12.5px;color:var(--muted)}
.st .n{font-family:var(--f-mono);font-size:12px;color:var(--faint);width:20px;flex:none;text-align:right}
.st-more{padding:0 14px 14px 98px;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.st-more .kv{display:flex;flex-direction:column}
.st-more .kv span{font-size:11.5px;font-weight:800;color:var(--faint);text-transform:uppercase;letter-spacing:.05em}
.st-more .kv b{font-weight:600;word-break:break-word}
.adminc{padding:16px;display:flex;gap:14px;align-items:center;border:2px solid var(--accent)}
.adminc .ph{width:64px;height:84px;border-radius:14px;object-fit:cover;flex:none;background:var(--surface-2)}
.role{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
@media (max-width:380px){.st-more{padding-left:14px}}

.wk{display:flex;flex-direction:column;gap:6px}
.wk-r{display:grid;grid-template-columns:86px 44px auto auto 1fr;gap:8px;align-items:center;font-size:13px}
.wk-d{font-weight:800}
.wk-t{font-family:var(--f-mono);font-size:12.5px}
.wk-w{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
@media (max-width:420px){.wk-r{grid-template-columns:82px 42px auto auto}.wk-w{grid-column:1/-1;padding-left:2px;margin-top:-4px}}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.pk{border:1.5px solid var(--line);background:var(--surface-2);border-radius:12px;padding:9px 10px;text-align:left;display:flex;flex-direction:column;gap:1px}
.pk b{font-size:13.5px}
.pk span{font-size:12px;color:var(--muted)}
.pk[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pk[aria-pressed="true"] span{color:var(--accent)}
details.install{font-size:13.5px;color:var(--muted)}
details.install summary{cursor:pointer;font-weight:700;color:var(--vein)}
details.install ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.gate{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.gate-card{max-width:420px;margin:6vh auto 0;display:flex;flex-direction:column;gap:14px}
.gate-card .logo{width:56px;height:56px;border-radius:18px}
.gate-card form{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:18px}
.gate-links{display:flex;flex-wrap:wrap;gap:8px}
</style>

function nowTash(){
  const parts=new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Tashkent",weekday:"short",hour:"2-digit",minute:"2-digit",day:"numeric",month:"numeric",hour12:false})
    .formatToParts(new Date()).reduce((o,p)=>(o[p.type]=p.value,o),{});
  const wd={Mon:0,Tue:1,Wed:2,Thu:3,Fri:4,Sat:5,Sun:6}[parts.weekday];
  return {wd, min:(+parts.hour%24)*60+(+parts.minute), day:+parts.day, month:+parts.month};
}

function lessonState(l,n){
  if(l.d!==n.wd) return "";
  const [s,e]=PARAS[l.p].map(toMin);
  return n.min>=s&&n.min<e?"live":n.min>=e?"past":"";
}
function lessonCard(l,state){
  const [s,e]=PARAS[l.p];
  return `<div class="lesson ${state}" style="--sc:${SC[l.key]}">
    <div class="t"><b>${s}</b><small>${e}</small></div>
    <div class="body">
      <div class="top"><span class="para">${l.p}-para${state==="live"?" · hozir":""}</span><span class="type">${l.type}</span></div>
      <div class="name">${esc(l.name)}</div>
      <div class="top"><span class="who">${esc(l.who)}</span><span class="pill room">${l.room}</span></div>
    </div></div>`;
}
function viewSchedule(){
  const n=nowTash();
  if(S.day==null) S.day = n.wd<=4 ? n.wd : 0;
  const day=S.day; const list=LESSONS.filter(l=>l.d===day).sort((a,b)=>a.p-b.p);
  const isToday=day===n.wd;
  // hero: current / next lesson today, else first lesson of the next school day
  let hero="";
  if(n.wd<=4){
    const today=LESSONS.filter(l=>l.d===n.wd).sort((a,b)=>a.p-b.p);
    const live=today.find(l=>lessonState(l,n)==="live");
    const next=today.find(l=>toMin(PARAS[l.p][0])>n.min);
    const pick=live||next;
    if(pick){
      const mins=toMin(PARAS[pick.p][0])-n.min;
      const label=live?"Hozir darsda":mins<=60?`${mins} daqiqadan keyin`:"Bugungi keyingi dars";
      hero=heroCard(pick,label,live);
    }
  }
  if(!hero){
    const nd = n.wd>=4 ? 0 : n.wd+1; const first=LESSONS.filter(l=>l.d===nd).sort((a,b)=>a.p-b.p)[0];
    if(first) hero=heroCard(first, n.wd>=4?`Dushanba · birinchi dars`:`Ertaga · birinchi dars`, false);
  }
  const rows=[]; const maxP=list.length?Math.max(...list.map(l=>l.p)):0; const minP=list.length?Math.min(...list.map(l=>l.p)):0;
  for(let p=minP;p<=maxP;p++){
    const l=list.find(x=>x.p===p);
    if(l) rows.push(lessonCard(l,isToday?lessonState(l,n):""));
    else rows.push(`<div class="lesson free"><div class="t"><b>${PARAS[p][0]}</b><small>${PARAS[p][1]}</small></div><div class="body"><div class="name">${p}-para · bo'sh vaqt</div></div></div>`);
  }
  const first=list[0], last=list[list.length-1];
  $("#view").innerHTML=`
    ${hwBanner()}
    ${hero}
    <div class="seg" role="group" aria-label="Hafta kuni">${DAYS.map(([full,short],i)=>`<button data-d="${i}" aria-pressed="${i===day}" class="${i===n.wd?"today":""}" aria-label="${full}">${short}<small>${LESSONS.filter(l=>l.d===i).length} para</small><span class="dot"></span></button>`).join("")}</div>
    <div class="titlebar"><h1>${DAYS[day][0]}${isToday?" · bugun":""}</h1>
      ${first?`<div class="daysum"><span><b>${list.length}</b> ta para</span><span>·</span><span><b>${PARAS[first.p][0]}</b> dan <b>${PARAS[last.p][1]}</b> gacha</span></div>`:""}</div>
    <div class="timeline">${rows.join("")||`<div class="card empty">Bu kuni dars yo'q.</div>`}</div>
    <p class="lede" style="font-size:13px">Har bir para 80 daqiqa. Sariq qatordagi ma'ruzalar butun oqim uchun umumiy.</p>`;
  document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{S.day=+b.dataset.d;viewSchedule();});
}
function heroCard(l,label,live){
  const [s,e]=PARAS[l.p];
  return `<div class="card now" style="--sc:${SC[l.key]}">
    <div class="tag">${live?"<i></i>":""}${label}</div>
    <div class="hsubj">${esc(l.name)}</div>
    <div class="meta"><span class="pill room">${l.room}</span><span class="pill">${s} – ${e}</span><span class="pill">${l.p}-para</span><span class="pill" style="color:${SC[l.key]}">${l.type}</span></div>

/* ---------------- 1. Atamalar ---------------- */
function deck(){ return TERMS.map((t,i)=>({i,cat:t[0],la:t[1],uz:t[2]})).filter(t=>S.cards.cat==="all"||t.cat===S.cards.cat); }
function resetDeck(){ const d=deck(); const unknown=d.filter(t=>!S.known.has(t.la)); const pool=unknown.length?unknown:d;
  S.cards.order=shuffle(pool).map(t=>t.i); S.cards.i=0; S.cards.flipped=false; }
function viewTerms(){
  if(!S.cards.order.length) resetDeck();
  const d=deck(); const known=d.filter(t=>S.known.has(t.la)).length;
  const t=TERMS[S.cards.order[S.cards.i]]; const no=String(S.cards.order[S.cards.i]+1).padStart(3,"0");
  const catBtns=[["all","Hammasi",TERMS.length],...Object.entries(CATS).map(([k,v])=>[k,v,TERMS.filter(x=>x[0]===k).length])]
    .map(([k,v,n])=>`<button class="chip" data-cat="${k}" aria-pressed="${S.cards.cat===k}">${v}<span class="n">${n}</span></button>`).join("");
  $("#view").innerHTML=`
    <div class="titlebar"><h1>Lotincha atamalar</h1>
      <p class="lede">Kartani bosing — tarjimasi ochiladi. Bilganlaringizni belgilang, qolganlari qayta chiqadi.</p></div>
    <div class="chips" role="group" aria-label="Bo'lim">${catBtns}</div>
    <button class="specimen ${S.cards.flipped?"flipped":""}" id="card" aria-label="Kartani ochish">
      <div class="top"><span>No. ${no}</span><span class="cat">${t[0]} · ${CATS[t[0]]}</span></div>
      <div class="latin">${esc(t[1])}</div>
      <div><div class="uz ${S.cards.flipped?"":"hidden"}">${S.cards.flipped?esc(t[2]):"&nbsp;"}</div>
        <div class="hint">Tarjimani ko'rish uchun bosing</div></div>
    </button>
    <div class="row"><button class="btn" id="again">Yana takrorlayman</button><button class="btn primary" id="know">Bilaman</button></div>
    <div class="progress"><span>${known}/${d.length} yodlandi</span><div class="bar"><i style="width:${d.length?known/d.length*100:0}%"></i></div>
      <button class="btn ghost" id="resetKnown" style="padding:4px 8px;font-size:12px">Nolga</button></div>
    `;
  document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{S.cards.cat=b.dataset.cat;resetDeck();viewTerms();});
  $("#card").onclick=()=>{S.cards.flipped=!S.cards.flipped;viewTerms();};
  const next=()=>{ S.cards.i++; S.cards.flipped=false; if(S.cards.i>=S.cards.order.length) resetDeck(); viewTerms(); };
  $("#know").onclick=()=>{S.known.add(t[1]);store.set("known",[...S.known]);next();};
  $("#again").onclick=next;
  $("#resetKnown").onclick=()=>{d.forEach(x=>S.known.delete(x.la));store.set("known",[...S.known]);resetDeck();viewTerms();};
}

/* ---------------- 2. Test ---------------- */
function bank(){ return STARTER.concat(S.shared); }
function latinQuiz(n){
  return shuffle(TERMS).slice(0,n).map((t,i)=>{
    const wrong=shuffle(TERMS.filter(x=>x[2]!==t[2]&&x[0]===t[0])).slice(0,3).map(x=>x[2]);
    const opts=shuffle([t[2],...wrong]);
    return {id:"lat"+i,subject:"Lotincha atamalar",q:`<em>${esc(t[1])}</em> — tarjimasi qaysi?`,html:true,options:opts,answer:opts.indexOf(t[2]),note:`${t[1]} — ${t[2]}`};
  });
}
function startQuiz(subject){
  let qs;
  if(subject==="__lat") qs=latinQuiz(10);
  else qs=shuffle(bank().filter(q=>subject==="__all"||q.subject===subject)).slice(0,10).map(q=>{
    const idx=shuffle(q.options.map((o,i)=>i).filter(i=>q.options[i]!=null&&q.options[i]!==""));
    return {...q,options:idx.map(i=>q.options[i]),answer:idx.indexOf(q.answer)};
  });
  if(!qs.length) return;
  S.quiz={subject,qs,i:0,correct:0,picked:null,done:false,saved:null};
  viewTest();
}
function viewTest(){
  const z=S.quiz;
  if(!z){
    const b=bank(); const counts={}; b.forEach(q=>counts[q.subject]=(counts[q.subject]||0)+1);
    const tiles=[`<button class="subj lat" data-s="__lat" style="--sc:var(--c-anat)"><span class="ic">La</span><b>Lotincha atamalar</b><small>${TERMS.length} ta atama</small></button>`,
      `<button class="subj" data-s="__all" style="--sc:var(--vein)"><span class="ic">∑</span><b>Aralash test</b><small>${b.length} ta savol</small></button>`,
      ...SUBJECTS.filter(s=>counts[s]).map(s=>`<button class="subj" data-s="${esc(s)}" style="--sc:${SC[SUBJ_KEY[s]]}"><span class="ic">${esc(s[0])}</span><b>${esc(s)}</b><small>${counts[s]} ta savol</small></button>`)].join("");
    $("#view").innerHTML=`
      <div class="titlebar"><h1>Test</h1><p class="lede">Fanni tanlang — 10 ta savol. To'g'ri javoblar reytingdagi ballingizga qo'shiladi.</p></div>
      <div class="subjects">${tiles}</div>${statusNote()}`;
    document.querySelectorAll("[data-s]").forEach(el=>el.onclick=()=>startQuiz(el.dataset.s));
    return;
  }
  if(z.done){
    const pct=Math.round(z.correct/z.qs.length*100);
    $("#view").innerHTML=`
      <div class="card result">
        <h2>${esc(z.subject==="__lat"?"Lotincha atamalar":z.subject==="__all"?"Aralash test":z.subject)}</h2>
        <div class="big">${z.correct}<small> / ${z.qs.length}</small></div>
        <p>${pct>=80?"A'lo natija! Shu ruhda davom eting.":pct>=50?"Yaxshi. Xato qilgan savollaringizni qayta ko'rib chiqing.":"Yana bir bor urinib ko'ring — takrorlash yodlashning onasi."}</p>
        <p class="lede" id="saveMsg">${z.saved===true?`+${z.correct} ball reytingga qo'shildi.`:z.saved===false?"Ball saqlanmadi: reyting faqat Claude hisobiga kirganlar uchun ishlaydi.":"Ball saqlanmoqda…"}</p>
        <div class="row" style="width:100%"><button class="btn" id="back">Fanlar</button><button class="btn primary" id="again">Yana 10 ta savol</button></div>
      </div>`;
    $("#back").onclick=()=>{S.quiz=null;viewTest();};
    $("#again").onclick=()=>startQuiz(z.subject);
    return;
  }
  const q=z.qs[z.i]; const answered=z.picked!=null;
  $("#view").innerHTML=`
    <div class="qhead"><span>${esc(q.subject)}${q.author?" · kursdosh savoli":""}</span><span class="sc">${z.i+1}/${z.qs.length} · ✓${z.correct}</span></div>
    <div class="bar"><i style="width:${z.i/z.qs.length*100}%"></i></div>
    <div class="qtext">${q.html?q.q:esc(q.q)}</div>
    <div class="opts">${q.options.map((o,i)=>{
      let cls=""; if(answered){ if(i===q.answer) cls="right"; else if(i===z.picked) cls="wrong"; }
      return `<button class="opt ${cls}" data-i="${i}" ${answered?"disabled":""}><span class="k">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`;}).join("")}</div>
    ${answered&&q.note?`<p class="explain">${esc(q.note)}</p>`:""}
    ${answered?`<button class="btn vein" id="next">${z.i+1<z.qs.length?"Keyingi savol":"Natijani ko'rish"}</button>`:`<button class="btn ghost" id="quit">Testni to'xtatish</button>`}`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ if(z.picked!=null) return; z.picked=+b.dataset.i; if(z.picked===q.answer) z.correct++; viewTest(); });
  if(answered) $("#next").onclick=()=>{ z.i++; z.picked=null; if(z.i>=z.qs.length){ z.done=true; saveScore(z); } viewTest(); };
  else $("#quit").onclick=()=>{S.quiz=null;viewTest();};
}
async function saveScore(z){
  if(!S.db||!S.uid){ z.saved=false; return; }
  try{
    const ref=S.db.doc("scores/"+S.uid); const snap=await ref.get(); const o=snap.exists?snap.data():{};
    await ref.set({points:(o.points||0)+z.correct, tests:(o.tests||0)+1, answered:(o.answered||0)+z.qs.length,
      best:Math.max(o.best||0,Math.round(z.correct/z.qs.length*100)), updatedAt:new Date().toISOString()});
    z.saved=true;
  }catch(e){ z.saved=false; }
  if(S.quiz===z&&route()==="test") viewTest();
}

const SUBJ_IC={anat:"An",kim:"Ki",bio:"Bi",tarix:"Ta",til:"Xt",kasb:"Tk"};
function todayYMD(){ return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Tashkent",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date()); }
function addDays(ymd,n){ const d=new Date(ymd+"T00:00:00Z"); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function wdOf(ymd){ return (new Date(ymd+"T00:00:00Z").getUTCDay()+6)%7; }
function fmtDate(ymd){ const d=new Date(ymd+"T00:00:00Z"); return `${WEEK[wdOf(ymd)]}, ${d.getUTCDate()}-${MONTHS[d.getUTCMonth()]}`; }
// next lesson of a subject: today counts only if that lesson has not ended yet; strict=true skips today
function nextLesson(key,strict){
  const t=todayYMD(), n=nowTash();
  for(let i=strict?1:0;i<=14;i++){ const d=addDays(t,i), wd=wdOf(d);
    const ls=LESSONS.filter(l=>l.key===key&&l.d===wd).sort((a,b)=>a.p-b.p);
    for(const l of ls){ if(i===0&&n.min>=toMin(PARAS[l.p][1])) continue; return {date:d,lesson:l}; } }
  return null;
}
function upcoming(key,count){ const t=todayYMD(); const out=[];
  for(let i=1;i<=21&&out.length<count;i++){ const d=addDays(t,i), wd=wdOf(d);
    LESSONS.filter(l=>l.key===key&&l.d===wd).sort((a,b)=>a.p-b.p).forEach(l=>{ if(out.length<count) out.push({date:d,lesson:l}); }); }
  return out; }
function hwLesson(h){ const wd=wdOf(h.due); return LESSONS.find(x=>x.key===h.subject&&x.d===wd&&(!h.para||x.p===h.para))||LESSONS.find(x=>x.key===h.subject&&x.d===wd); }
const typeDat={"Ma'ruza":"ma'ruzasiga","Amaliy":"amaliy darsiga","Seminar":"seminariga"};

function currentHw(key){ const t=todayYMD(); return S.homework.filter(h=>h.subject===key&&h.due>=t).sort((a,b)=>a.due.localeCompare(b.due)||(a.para||0)-(b.para||0)||(b.createdAt||"").localeCompare(a.createdAt||"")); }

// Ilovaning qolgan qismi ishlatadigan oddiy interfeys
const wrapSnap = s => ({ docs: s.docs.map(d => ({ id: d.id, data: () => d.data() })) });
const DBA = {
  collection(name) {
    const c = collection(fs, name);
    const sub = q => ({ onSnapshot: (fn, err) => onSnapshot(q, s => fn(wrapSnap(s)), err || (() => {})) });
    return {
      add: d => addDoc(c, d),
      onSnapshot: (fn, err) => onSnapshot(c, s => fn(wrapSnap(s)), err || (() => {})),
      orderBy: (f, dir) => ({ limit: n => sub(query(c, orderBy(f, dir), limit(n))) })
    };
  },
  doc(path) {
    const r = doc(fs, path);
    return {
      get: async () => { const s = await getDoc(r); return { exists: s.exists(), data: () => s.data() }; },
      set: d => setDoc(r, d), update: d => updateDoc(r, d), delete: () => deleteDoc(r)
    };
  }
};

    <div class="titlebar"><h1>Admin</h1><p class="lede">Ro'yxatdan o'tganlarni tasdiqlang. Tasdiqlanmagan odam faqat jadval va atamalarni ko'radi.</p></div>
    <div class="sec"><h2>Foydalanuvchilar · ${users.length}${S.pending.length ? ` · ${S.pending.length} ta kutmoqda` : ""}</h2>
      <div class="card list">${users.length ? users.map(x => `<div class="li"><div class="t"><div>${esc(x.name || "—")}</div><small>${esc(x.email || "")} · ${x.approved ? "tasdiqlangan" : "kutmoqda"}</small></div>
        ${x.approved ? (x.id === S.uid ? "" : `<button class="del" data-unap="${x.id}">Bekor</button>`) : `<button class="mini blue" data-ap="${x.id}">Tasdiqlash</button><button class="del" data-rm="${x.id}">✕</button>`}</div>`).join("") : `<div class="empty">Hali hech kim ro'yxatdan o'tmagan.</div>`}</div></div>
    <div class="sec"><h2>Guruh ma'lumotlari</h2>
      <form class="card compact" id="seedf"><p class="lede" style="font-size:13.5px">Kursdoshlarning manzil va telefonlari ilova ichida shifrlangan holda turibdi. Bir marta maxfiy kalitni kiritib, bazaga yuklang. Hozir bazada: <b>${S.students.length}</b> ta yozuv.</p>
        <label for="seed-key">Maxfiy kalit<input type="password" id="seed-key" autocomplete="off"></label>
        <button class="btn vein" type="submit">Bazaga yuklash</button><div class="formmsg" id="seed-msg" role="status"></div></form></div>`;
  document.querySelectorAll("[data-ap]").forEach(b => b.onclick = () => updateDoc(doc(fs, "users/" + b.dataset.ap), { approved: true }));
  document.querySelectorAll("[data-unap]").forEach(b => confirmBtn(b, () => updateDoc(doc(fs, "users/" + b.dataset.unap), { approved: false })));
  document.querySelectorAll("[data-rm]").forEach(b => confirmBtn(b, () => deleteDoc(doc(fs, "users/" + b.dataset.rm))));
  $("#seedf").onsubmit = async e => { e.preventDefault(); const m = $("#seed-msg"); m.className = "formmsg"; m.textContent = "Yuklanmoqda…";
    try { const rows = await decryptSeed($("#seed-key").value); const batch = writeBatch(fs);
      rows.forEach(r => { const { id, ...rest } = r; batch.set(doc(fs, "students/" + id), rest); }); await batch.commit();
      m.className = "formmsg ok"; m.textContent = rows.length + " ta kursdosh bazaga yuklandi."; }
    catch (err) { m.className = "formmsg err"; m.textContent = err && err.name === "OperationError" ? "Kalit noto'g'ri." : "Yuklab bo'lmadi: " + ((err && (err.code || err.message)) || ""); } };
};
async function decryptSeed(pass) {
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(SEED.salt), iterations: SEED.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(SEED.iv) }, key, b64(SEED.data));
  return JSON.parse(new TextDecoder().decode(plain));
}

/* ---------- Telefon eslatmalari (dars oldidan) ---------- */
let schedTimer = null;
function scheduleNotifs(ask) {
  clearTimeout(schedTimer);
  schedTimer = setTimeout(async () => {
    const C = window.Capacitor; const LN = C && ((C.Plugins && C.Plugins.LocalNotifications) || (C.registerPlugin && C.registerPlugin("LocalNotifications")));
    if (!LN) return;
    try {
      let p = await LN.checkPermissions();
      if (p.display !== "granted" && ask) p = await LN.requestPermissions();
      if (p.display !== "granted") return;
      const pend = await LN.getPending(); if (pend.notifications.length) await LN.cancel({ notifications: pend.notifications.map(n => ({ id: n.id })) });
      const t = todayYMD(), now = Date.now(), list = [];
      for (let i = 1; i <= 14; i++) {
        const d = addDays(t, i), wd = wdOf(d); const ls = LESSONS.filter(l => l.d === wd).sort((a, b) => a.p - b.p); if (!ls.length) continue;
        const prev = addDays(d, -1).split("-").map(Number); const at = new Date(prev[0], prev[1] - 1, prev[2], 20, 0);
        const hws = S.homework.filter(h => h.due === d);
        const lines = ls.map(l => `${PARAS[l.p][0]} ${l.name} (${l.type}, ${l.room})`);
        hws.forEach(h => lines.push(`Vazifa · ${SUBJ[h.subject] || ""}: ${h.topic ? h.topic + " — " : ""}${h.text}`));
        if (at.getTime() > now) list.push({ id: 1000 + i, title: hws.length ? `Ertaga ${ls.length} para · uyga vazifa bor!` : `Ertaga ${ls.length} para`, body: lines.join("\n"), largeBody: lines.join("\n"), schedule: { at, allowWhileIdle: true } });
        if (hws.length) { const dd = d.split("-").map(Number); const am = new Date(dd[0], dd[1] - 1, dd[2], 7, 0);
          if (am.getTime() > now) list.push({ id: 2000 + i, title: "Bugun dars · uyga vazifani unutmang", body: hws.map(h => `${SUBJ[h.subject] || ""}: ${h.text}`).join("\n"), largeBody: hws.map(h => `${SUBJ[h.subject] || ""}: ${h.text}`).join("\n"), schedule: { at: am, allowWhileIdle: true } }); }
      }
      if (list.length) await LN.schedule({ notifications: list });
    } catch (e) {}
  }, 800);
}
